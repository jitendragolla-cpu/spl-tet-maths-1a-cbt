<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPL TET Maths 1A — 630 Question CBT</title>
<meta name="description" content="SPL TET Maths 1A — 630 question CBT based on the supplied source PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{{--ink:#172033;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--purple:#7c3aed;--green:#059669;--red:#dc2626;--amber:#d97706;--bg:#f5f7fb;--card:#fff}}
*{{box-sizing:border-box}}
html{{scroll-behavior:smooth}}
body{{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Telugu','Nirmala UI','Gautami',Arial,sans-serif;-webkit-font-smoothing:antialiased}}
button,input{{font:inherit}}
.app{{max-width:1180px;margin:0 auto;padding:14px}}
.hero{{background:linear-gradient(135deg,#2563eb,#7c3aed 52%,#db2777);color:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 12px 35px rgba(37,99,235,.18)}}
.hero h1{{margin:0;font-size:clamp(20px,3vw,31px);font-weight:700;letter-spacing:.1px}}
.hero p{{margin:5px 0 0;font-size:14px;opacity:.94}}
.topbar{{position:sticky;top:0;z-index:20;margin:12px 0;background:rgba(245,247,251,.94);backdrop-filter:blur(10px);padding:8px 0}}
.stats{{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}}
.stat{{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;box-shadow:0 3px 12px rgba(16,24,40,.04)}}
.stat b{{display:block;font-size:16px}} .stat span{{font-size:11px;color:var(--muted)}}
.layout{{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}}
.card{{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 22px rgba(16,24,40,.06)}}
.question{{padding:18px;margin-bottom:12px;scroll-margin-top:105px}}
.qhead{{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}}
.qnum{{min-width:44px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}}
.qtext{{font-size:16px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}}
.options{{display:grid;gap:9px}}
.opt{{display:flex;align-items:flex-start;gap:10px;border:1px solid #dbe1ea;border-radius:11px;padding:11px 12px;cursor:pointer;background:#fff;transition:.15s ease;line-height:1.6}}
.opt:hover{{border-color:#93c5fd;background:#f8fbff}}
.opt input{{margin-top:5px;accent-color:#2563eb;flex:0 0 auto}}
.opt .olabel{{font-weight:700;color:#475467;min-width:27px}}
.opt .otext{{white-space:pre-wrap;overflow-wrap:anywhere;flex:1}}
.opt.selected{{border-color:#2563eb;background:#eff6ff}}
.opt.correct{{border-color:#10b981;background:#ecfdf5}}
.opt.wrong{{border-color:#ef4444;background:#fef2f2}}
.palette{{padding:14px;position:sticky;top:105px}}
.palette h3{{margin:0 0 8px;font-size:15px}}
.grid{{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-height:68vh;overflow:auto;padding-right:2px}}
.pbtn{{border:1px solid #d9dee8;background:#fff;border-radius:7px;padding:5px 0;font-size:11px;cursor:pointer}}
.pbtn.answered{{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8;font-weight:700}}
.pbtn.current{{outline:2px solid #7c3aed;outline-offset:1px}}
.pbtn.review{{background:#fff7ed;border-color:#fdba74;color:#c2410c}}
.controls{{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}}
.btn{{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}}
.primary{{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}}
.secondary{{background:#fff;border:1px solid #d9dee8;color:#344054}}
.warn{{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}}
.submit{{width:100%;margin-top:4px;background:linear-gradient(135deg,#059669,#0d9488);color:#fff;padding:12px;border:0;border-radius:11px;font-weight:700;cursor:pointer}}
.result{{display:none;margin-bottom:12px;padding:16px;border-radius:16px;background:#fff;border:1px solid #c7d2fe}}
.result.show{{display:block}}
.score{{font-size:28px;font-weight:800;color:#1d4ed8}}
.note{{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}}
.footer{{text-align:center;color:#667085;font-size:12px;padding:20px 5px}}
@media(max-width:820px){{.app{{padding:8px}}.layout{{grid-template-columns:1fr}}.palette{{position:static;order:-1}.grid{{max-height:180px;grid-template-columns:repeat(10,1fr)}}.stats{{grid-template-columns:repeat(2,1fr)}}.question{{padding:13px}.qtext{{font-size:15px}}}}
@media(max-width:520px){{.hero{{border-radius:13px;padding:14px}}.grid{{grid-template-columns:repeat(8,1fr)}}.opt{{padding:9px}}.controls .btn{{flex:1;min-width:120px}}}}
</style>
</head>

</div>

dy":"The ratio of two numbers is 1:2 and their sum is 60. The\n      largest number is\n      రిండు సింఖ్యల నిషపతిత 1:2 మరియు వాటి మొత్తిం 60. అయితే గరిషఠ\n       సింఖ్య","options":[{"label":"1","text":"20"},{"label":"2","text":"40"},{"label":"3","text":"25"},{"label":"4","text":"45"}],"answer":2},{"n":109,"body":"If the cost of 6 pens is ₹ 210. Then the cost of 4 pens is\n       6 పెనునల ఖ్ర్డదు ₹ 210 అయిన 4 పెనునల ఖ్ర్డదు","options":[{"label":"1","text":"₹ 70"},{"label":"2","text":"₹ 105"},{"label":"3","text":"₹ 140"},{"label":"4","text":"₹ 165"}],"answer":3},{"n":110,"body":"The ratio of 90 cm to 1.5m is\n      90 సిం. మీ. కు, 1.5 మీటర్ీకు నిషపతిత","options":[{"label":"1","text":"5:2"},{"label":"2","text":"5:3"},{"label":"3","text":"2:5"},{"label":"4","text":"3:5"}],"answer":4},{"n":111,"body":"Length and breadth of a rectangular field are 50m and\n      15m respectively. The ratio of the length to the breadth\n      of the field is\n      దీర్ఘచతర్స్రాకార్ పలిం యొక్క పడవు మరియు వెడలుపలు\n       వరుసగా 50 మీటరుీ మరియు 15 మీటరుీ. పలిం యొక్క పడవు\n       మరియు వెడలుపల నిషపతిత","options":[{"label":"1","text":"3:5"},{"label":"2","text":"5:3"},{"label":"3","text":"3:10"},{"label":"4","text":"10:3"}],"answer":4},{"n":112,"body":"The ratio of two numbers is 7:5. If the smallest number\n      is 30 then the sum of the two numbers is\n      రిండు సింఖ్యల నిషపతిత 7:5. వాటిలో క్నిషఠ సింఖ్య 30 అయితే ఆ\n      రిండు సింఖ్యల మొత్తిం","options":[{"label":"1","text":"48"},{"label":"2","text":"60"},{"label":"3","text":"42"},{"label":"4","text":"72"}],"answer":4},{"n":113,"body":"If the cost of a dozen soaps is ₹153.60, then the cost of\n      15 such soaps is\n      డజను సబుబల ఖ్ర్డదు ₹153.60 అయితే, అటువింటి 15 సబుబల\n      ఖ్ర్డదు","options":[{"label":"1","text":"₹192"},{"label":"2","text":"₹180"},{"label":"3","text":"₹196"},{"label":"4","text":"₹240"}],"answer":1},{"n":114,"body":"In a class, there are 51 boys and 68 girls. The ratio of\n      the number of boys to the number of girls is\n      ఒక్ త్ర్గతిలో 51 మింది బాలురు మరియు 68 మింది బాలిక్లు\n      క్లరు. బాలుర్ సింఖ్య మరియు బాలిక్ల సింఖ్య యొక్క నిషపతిత","options":[{"label":"1","text":"3:5"},{"label":"2","text":"4:3"},{"label":"3","text":"3:2"},{"label":"4","text":"3:4"}],"answer":4},{"n":115,"body":"If the cost of 7m of cloth is ₹1470, then the cost of 5m\n      of cloth is\n      7 మీటర్ీ వసరిం ధ్ర్ ₹1470 అయితే, 5 మీటర్ీ వసరిం ధ్ర్ ఖ్ర్డదు","options":[{"label":"1","text":"₹1000"},{"label":"2","text":"₹1050"},{"label":"3","text":"₹1200"},{"label":"4","text":"₹1250"}],"answer":2},{"n":116,"body":"The weight of 72 books is 9 Kg. The weight of 40 such\n      books is (in Kgs.)\n      72 పుసతకాల బరువు 9 కిలోలు. అటువింటి 40 పుసతకాల బరువు (కి.\n      గ్రా. లలో)","options":[{"label":"1","text":"6"},{"label":"2","text":"7"},{"label":"3","text":"4"},{"label":"4","text":"5"}],"answer":4},{"n":117,"body":"Distance travelled by A and B in an hour are 9 Km and\n      12 Km. The ratio of speed of A to the speed of B is\n      A మరియు B లు ఒక్ గింటలో ప్రయాణించిన దూర్ిం 9 కిలోమీటరుీ\n      మరియు 12 కిలోమీటరుీ. అయితే A వేగానికి, B వేగానికి గల నిషపతిత","options":[{"label":"1","text":"4:3"},{"label":"2","text":"3:2"},{"label":"3","text":"3:4"},{"label":"4","text":"2:3"}],"answer":3},{"n":118,"body":"The equivalent ratio of 65:117 is\n      65:117 యొక్క తలయ నిషపతిత","options":[{"label":"1","text":"5:9"},{"label":"2","text":"5:11"},{"label":"3","text":"7:9"},{"label":"4","text":"11:13"}],"answer":1},{"n":119,"body":"There are 102 teachers in a school of 3300 students. The\n      ratio of the number of teachers to the number of students\n      is\n      3300 మింది విద్వయరు్లు ఉనన ఒక్ స్కకలులో 102 మింది టీచరుీ\n      ఉన్ననరు. టీచర్ీ సింఖ్య మరియు విద్వయరు్ల సింఖ్య యొక్క నిషపతిత","options":[{"label":"1","text":"17:550"},{"label":"2","text":"19:55"},{"label":"3","text":"17:55"},{"label":"4","text":"3:550"}],"answer":1},{"n":120,"body":"Which of the following numbers are not in proportion\n      in that order is\n      కిింది వాటిలో ఏ సింఖ్యలు అదే క్రమింలో అనుపాత్ిం లో ఉిండవు.","options":[{"label":"1","text":"4, 6, 8, 12"},{"label":"2","text":"15, 45, 40, 120"},{"label":"3","text":"33, 44, 75, 100"},{"label":"4","text":"24, 28, 36, 48"}],"answer":4},{"n":121,"body":"The simplest form of the ratio 132:143 is\n      132:143 నిషపతిత యొక్క స్కక్ష్మ రూపిం.","options":[{"label":"1","text":"12:13"},{"label":"2","text":"12:11"},{"label":"3","text":"12:17"},{"label":"4","text":"13:12"}],"answer":1},{"n":122,"body":"A motor bike travels 220 Km in 5 litres of petrol. How\n      much distance will it cover in 1.5 litres of petrol? (in\n      Kms.)\n      ఒక్ మోటార్ బైక్ 5 లీటర్ీ పెట్రోల్ తో 220 కిలోమీటరుీ\n      ప్రయాణించిింది. 1.5 లీటర్ీ పెట్రోల్ తో ఇది ఎింత్ దూర్ిం\n      ప్రయాణసుతింది? (కి. మీ. లలో)","options":[{"label":"1","text":"66"},{"label":"2","text":"60"},{"label":"3","text":"48"},{"label":"4","text":"45"}],"answer":1},{"n":123,"body":"A truck requires 108 litres of diesel for covering a\n      distance of 594 km. How much diesel will be required\n      by the truck to cover a distance of 1650Km.? (in litres)\n      ఒక్ ట్రకుక 594 కిలోమీటర్ీ దూర్ిం ప్రయాణించడిం క్కర్కు 108\n      లీటర్ీ డీజిల్ అవసర్ిం అవుతింది.         1650 కిలోమీటర్ీ దూర్ిం\n      ప్రయాణించడిం క్కర్కు ట్రకుకకు ఎింత్ డీజిల్ అవసర్ిం అవుతింది?\n      (లీటర్ీలో)","options":[{"label":"1","text":"250"},{"label":"2","text":"300"},{"label":"3","text":"350"},{"label":"4","text":"400"}],"answer":2},{"n":124,"body":"If the cost of 5Kg of wheat is ₹ 91.50. Then the cost of\n      8Kg of wheat is\n      5 కి. గ్రా. ల గోధుమల ధ్ర్ ₹ 91.50 అయితే 8 కి. గ్రా. ల గోధుమల\n      ధ్ర్","options":[{"label":"1","text":"₹144.80"},{"label":"2","text":"₹145.60"},{"label":"3","text":"₹146.40"},{"label":"4","text":"₹148.40"}],"answer":3},{"n":125,"body":"In a college out of 4320 students, 2300 are girls. The\n      ratio of number of girls to the total number of students\n      is\n      ఒక్ క్ళాశాలలో 4320 మింది విద్వయరు్లలో 2300 మింది బాలిక్లు.\n      అయితే మొత్తిం బాలిక్ల సింఖ్యకు, మొత్తిం విద్వయరు్ల సింఖ్యకు గల\n      నిషపతిత","options":[{"label":"1","text":"115:216"},{"label":"2","text":"117:216"},{"label":"3","text":"119:216"},{"label":"4","text":"216:115"}],"answer":1},{"n":126,"body":"Present age of father is 42 years and that of his son is 14\n      years. After 8 years, the ratio of age of father to that of\n      son is\n      ప్రసుత్ త్ిండ్రి వయసుు 42 సింవత్ురాలు మరియు అత్ని కుమ్యరుడి\n      వయసుు 14 సింవత్ురాలు. 8 సింవత్ురాల త్రాాత్, త్ిండ్రి\n      వయసుుకు, కుమ్యరుడి వయసుుకు మధ్య నిషపతిత","options":[{"label":"1","text":"25:11"},{"label":"2","text":"11:25"},{"label":"3","text":"5:11"},{"label":"4","text":"3:11"}],"answer":1},{"n":127,"body":"The population of a city decreased form 25,000 to\n      24,500. The percentage of decrease is\n      ఒక్ నగర్ జన్నభా 25,000 నుిండి 24,500 కు త్గగింది. అయితే\n      త్గుగద్ల శాత్ిం","options":[{"label":"1","text":"1%"},{"label":"2","text":"2%"},{"label":"3","text":"4%"},{"label":"4","text":"5%"}],"answer":2},{"n":128,"body":"If 20% of A = 35% of B, then B:A =\n     A లో 20% = B లో 35%, అయిన B:A =","options":[{"label":"1","text":"3:7"},{"label":"2","text":"2:7"},{"label":"3","text":"5:7"},{"label":"4","text":"4:7"}],"answer":4},{"n":129,"body":"72% of 25 students are interested in Mathematics.\n     Number of students are not interested in Mathematics\n     are\n     25 మింది విద్వయరు్లలో 72%మింది విద్వయరు్లు గణత్ింలో ఆసకిత\n     క్లిగ ఉింటే, ఆసకిత క్లిగ ఉిండని విద్వయరు్ల సింఖ్య","options":[{"label":"1","text":"7"},{"label":"2","text":"8"},{"label":"3","text":"9"},{"label":"4","text":"10"}],"answer":1},{"n":130,"body":"If Laxmi had ₹ 600 left after spending 75% of her\n     money, how much did she have in the beginning?\n     లక్ష్మీ త్న వద్దనునన డబుబలో 75% ఖ్రుు చేసిన త్రాాత్ ఆమె వద్ద\n     ₹600 మిగలిన, మొద్ట ఆమె వద్దనునన డబుబ ఎింత్?","options":[{"label":"1","text":"₹ 2000"},{"label":"2","text":"₹ 2400"},{"label":"3","text":"₹ 3000"},{"label":"4","text":"₹ 1800"}],"answer":2},{"n":131,"body":"There are 120 voters, 90 of them voted “YES”. The\n     percentage of voted “YES” is\n     120 మింది ఓటరుీ ఉన్ననరు. వారిలో 90 మింది ‘అవును’ అని ఓటు\n     వేశారు. ‘అవును’ అని ఓటు వేసిన వారి శాత్ిం","options":[{"label":"1","text":"80%"},{"label":"2","text":"60%"},{"label":"3","text":"70%"},{"label":"4","text":"75%\n\n                                       1"}],"answer":4},{"n":132,"body":"The fraction which is equal to 33 % is\n                                       3\n            1\n      33 % నకు సమ్యనమైన భిననిం\n            3\n                2","options":[{"label":"1","text":"3\n                1"},{"label":"2","text":"3\n                10"},{"label":"3","text":"3\n                100"},{"label":"4","text":"3"}],"answer":2},{"n":133,"body":"Out of 25 children in a class, 15 are girls. The\n      percentage of girls is\n      ఒక్ త్ర్గతిలో 25 మింది పిలీలలో 15 మింది బాలిక్లు, అయిన\n      బాలిక్ల శాత్ిం","options":[{"label":"1","text":"55%"},{"label":"2","text":"60%"},{"label":"3","text":"75%"},{"label":"4","text":"80%"}],"answer":2},{"n":134,"body":"If 9% of a number is 72 then 54% of that number is\n      ఒక్ సింఖ్యలో 9% విలువ 72 అయిన అదే సింఖ్యలో 54% విలువ","options":[{"label":"1","text":"432"},{"label":"2","text":"332"},{"label":"3","text":"532"},{"label":"4","text":"442"}],"answer":1},{"n":135,"body":"If 75% of 𝑥 = 15, then 𝑥 + 9=\n      𝑥 లో 75% = 15, అయిన 𝑥 + 9=","options":[{"label":"1","text":"16"},{"label":"2","text":"20"},{"label":"3","text":"25"},{"label":"4","text":"29"}],"answer":4},{"n":136,"body":"If 25% of 𝑥 = 9, then 𝑥 2 =\n      𝑥లో25% = 9, అయిన 𝑥 2 =","options":[{"label":"1","text":"576"},{"label":"2","text":"676"},{"label":"3","text":"1156"},{"label":"4","text":"1296"}],"answer":4},{"n":137,"body":"A man got a 10% increase in his salary. If his new\n      salary is ₹1,54,000, his original salary is\n      ఒక్ వయకిత వేత్నింలో 10% పెరిగన త్రాాత్ క్కత్త వేత్నిం ₹1,54,000\n      అయితే అత్ని అసలు వేత్నిం","options":[{"label":"1","text":"₹ 1,40,000"},{"label":"2","text":"₹ 1,36,000"},{"label":"3","text":"₹ 1,42,000"},{"label":"4","text":"₹ 1,44,000"}],"answer":1},{"n":138,"body":"If 60% of a number is 18 then 150% of the same number\n      is\n      ఒక్ సింఖ్యలో 60% విలువ 18 అయిన అదే సింఖ్యలో 150% విలువ","options":[{"label":"1","text":"30"},{"label":"2","text":"36"},{"label":"3","text":"45"},{"label":"4","text":"48"}],"answer":3},{"n":139,"body":"If 𝑥% of 𝑥=1, then the positive value for 𝑥 is\n      𝑥% of 𝑥=1అయిన 𝑥 యొక్క ధ్న్నత్మక్ విలువ","options":[{"label":"1","text":"200"},{"label":"2","text":"100"},{"label":"3","text":"10"},{"label":"4","text":"1\n            1"}],"answer":3},{"n":140,"body":"33 %𝑜𝑓 72 + 26 =\n         3\n              1\n      72 లో 33 % + 26 =\n              3","options":[{"label":"1","text":"40"},{"label":"2","text":"60"},{"label":"3","text":"48"},{"label":"4","text":"50\n                        1"}],"answer":4},{"n":141,"body":"50% of 164 – 12 % of 64=\n                        2\n                               1\n      164 లో 50% - 64 లో 12 % =\n                               2","options":[{"label":"1","text":"72"},{"label":"2","text":"74"},{"label":"3","text":"82"},{"label":"4","text":"90"}],"answer":2},{"n":142,"body":"15% of 12% of 24,000=","options":[{"label":"1","text":"288"},{"label":"2","text":"360"},{"label":"3","text":"432"},{"label":"4","text":"472\n         1           1"}],"answer":3},{"n":143,"body":"12 % of 48 + of 24 =\n         2           4\n                1            1\n      48 లో 12 % + 24 లో         వింత =\n                2            4","options":[{"label":"1","text":"10"},{"label":"2","text":"12"},{"label":"3","text":"18"},{"label":"4","text":"20"}],"answer":2},{"n":144,"body":"If a:b = 4:5 then what percent of ‘b’ is ‘a’ ?\n      a:b = 4:5 అయిన ‘b’ లో ఎింత్ శాత్ిం ‘a’ అవుతింది?","options":[{"label":"1","text":"60%"},{"label":"2","text":"75%"},{"label":"3","text":"80%"},{"label":"4","text":"90%"}],"answer":3},{"n":145,"body":"The ratio of incomes of A and B is 3:4. If income of A\n      is ₹ 48,000, then 25% of B’s income is\n      A మరియు B ల ఆద్వయాల నిషపతిత 3:4. A ఆద్వయిం ₹ 48,000\n      అయిన B ఆద్వయింలో 25% విలువ","options":[{"label":"1","text":"₹ 15,000"},{"label":"2","text":"₹ 16,000"},{"label":"3","text":"₹ 18,000"},{"label":"4","text":"₹ 20,000"}],"answer":2},{"n":146,"body":"A Football team won 10 matches out of the total number\n      of matches they played. If their winning percentage was\n      40, then the number of matches did they play in all is\n      ఒక్ ఫుట్ బాల్ జటుట ఆడిన మొత్తిం మ్యయచ్ లలో 10 మ్యయచ్ లు\n      గెలిచినది. గెలిచిన శాత్ిం 40 అయిన వారు ఆడిన మొత్తిం మ్యయచ్ల\n      సింఖ్య","options":[{"label":"1","text":"20"},{"label":"2","text":"25"},{"label":"3","text":"30"},{"label":"4","text":"24"}],"answer":2},{"n":147,"body":"15% of 250 + 20% of 360 =\n      250 లో 15% + 360 లో 20% =","options":[{"label":"1","text":"107.7"},{"label":"2","text":"105.7"},{"label":"3","text":"107.5"},{"label":"4","text":"109.5"}],"answer":4},{"n":148,"body":"A table marked at ₹15,000 is available for ₹14,400. The\n      discount percentage on it is\n      ₹15,000 ప్రక్టన వెల గల టేబుల్ ₹14,400 కి లభిస్తత, ద్వనిపై\n      రుసుము శాత్ిం","options":[{"label":"1","text":"3%"},{"label":"2","text":"4%"},{"label":"3","text":"5%"},{"label":"4","text":"6%"}],"answer":2},{"n":149,"body":"The list price of a book is ₹220. A discount of 20% is\n      announced on Sales. The amount of discount on it is\n      ఒక్ పుసతక్ిం ప్రక్టన వెల ₹220. ద్వనిపై 20% రుసుము ప్రక్టిించిన,\n      ఆ రుసుము వెల","options":[{"label":"1","text":"₹22"},{"label":"2","text":"₹44"},{"label":"3","text":"₹66"},{"label":"4","text":"₹88"}],"answer":2},{"n":150,"body":"An article is sold at ₹5225 after allowing a discount of\n      5%. Its marked price is\n      ఒక్ వసుతవుపై 5% రుసుము ప్రక్టిించిన త్రాాత్ ₹5225కు అమిమతే\n      ప్రక్టన వెల ఎింత్?","options":[{"label":"1","text":"₹5500"},{"label":"2","text":"₹5420"},{"label":"3","text":"₹5544"},{"label":"4","text":"₹5760"}],"answer":1},{"n":151,"body":"A person bought a second hand refrigerator for ₹2500,\n      then spent ₹500 on its repairs and sold it for ₹3300. His\n      gain percentage is\n      ఒక్ వయకిత పాత్ రిఫ్రిజిరేటర్ ను ₹2500 కు క్కని ద్వనిని ₹500 తో\n      మర్మమతత చేయిించి ₹3300 కు అమెమను. అత్ను పిందిన లాభ శాత్ిం","options":[{"label":"1","text":"5%"},{"label":"2","text":"8%"},{"label":"3","text":"10%"},{"label":"4","text":"15%"}],"answer":3},{"n":152,"body":"A person bought an air cooler for ₹3300 including a tax\n      of 10%. The price of the air cooler before VAT was\n      added is\n      ఒక్ వయకిత ఎయిర్ కూలర్ ను 10% పనునతో క్లిపి ₹3300కు క్కన్ననరు.\n      VAT క్లపక్ముిందు ఎయిర్ కూలర్ ఖ్ర్డదు","options":[{"label":"1","text":"₹2800"},{"label":"2","text":"₹2900"},{"label":"3","text":"₹2400"},{"label":"4","text":"₹3000"}],"answer":4},{"n":153,"body":"A person bought an article for ₹784 which included\n      GST of 12%. The price of the article before GST was\n      added is\n      ఒక్ వయకిత ఒక్ వసుతవును 12% GST తో క్లిపి ₹784 కు క్కనిన, GST\n      క్లుపక్ ముిందు వసుతవు వెల","options":[{"label":"1","text":"₹700"},{"label":"2","text":"₹600"},{"label":"3","text":"₹720"},{"label":"4","text":"₹750"}],"answer":1},{"n":154,"body":"A shopkeeper buys 80 articles for ₹2400 and sells them\n      for a profit of 16%. The selling price of one article is\n      ఒక్ దుకాణద్వరుడు 80 వసుతవులను ₹2400 కు క్కని 16% లాభానికి\n      అమిమతే, ఒక్ వసుతవు అమిమన వెల","options":[{"label":"1","text":"₹34"},{"label":"2","text":"₹34.80"},{"label":"3","text":"₹35.20"},{"label":"4","text":"₹36"}],"answer":2},{"n":155,"body":"The cost of a flower vase is ₹120. If the shopkeeper\n      sells it at a loss of 10%, it’s selling price is\n      ఒక్ పూలకుిండీ ఖ్ర్డదు ₹120. ఒక్ వేళ దుకాణద్వరుడు ద్వనిని 10%\n      నష్టటనికి అమిమతే, ద్వని అమమక్పు వెల","options":[{"label":"1","text":"₹108"},{"label":"2","text":"₹106"},{"label":"3","text":"₹100"},{"label":"4","text":"₹98"}],"answer":1},{"n":156,"body":"Selling price of a toy car is ₹540. If the profit made by\n      the shopkeeper is 20%, the cost price of this toy is\n      బొమమ కారు అమిమన వెల ₹540. దుకాణద్వరుడుకి వచిున లాభిం\n      20% అయితే ఆ బొమమ కారు క్కనన వెల","options":[{"label":"1","text":"₹512"},{"label":"2","text":"₹500"},{"label":"3","text":"₹480"},{"label":"4","text":"₹450"}],"answer":4},{"n":157,"body":"A shopkeeper bought a chair for ₹375 and sold it for\n      ₹400. The gain percentage is\n      ఒక్ దుకాణద్వరుడు ఒక్ కుర్డుని ₹375 కు క్కనుగోలు చేసి, ద్వనిని\n      ₹400 కు విక్రయిించిన, లాభ శాత్ిం","options":[{"label":"1","text":"15%"},{"label":"2","text":"16%\n                 2"},{"label":"3","text":"16 %\n                 3"},{"label":"4","text":"18%"}],"answer":3},{"n":158,"body":"An item was sold for ₹570 at a loss of 5%. Its cost price\n      is\n      ఒక్ వసుతవు 5% నషటింతో ₹570 లకు అమమబడిింది. ద్వని క్కనన వెల","options":[{"label":"1","text":"₹660"},{"label":"2","text":"₹650"},{"label":"3","text":"₹620"},{"label":"4","text":"₹600"}],"answer":4},{"n":159,"body":"If the cost price of a computer is ₹36000 and its selling\n      price is ₹45000, then gain percentage is\n      ఒక్ క్ింపూయటర్ క్కనన వెల ₹36000 మరియు ద్వని అమమక్పువెల\n      ₹45000 అయిన లాభ శాత్ిం","options":[{"label":"1","text":"12%"},{"label":"2","text":"15%"},{"label":"3","text":"20%"},{"label":"4","text":"25%"}],"answer":4},{"n":160,"body":"An article was sold for ₹2100 with a profit of 5%. Its\n      cost price was\n      ఒక్ వసుతవు 5% లాభింతో ₹2100 లకు అమమబడిింది. అయితే ద్వని\n      క్కనన వెల","options":[{"label":"1","text":"₹2000"},{"label":"2","text":"₹2050"},{"label":"3","text":"₹1900"},{"label":"4","text":"₹2010"}],"answer":1},{"n":161,"body":"The population of a city decreased form 25,000 to\n      22,500. The decreased percentage is\n      ఒక్ నగర్ జన్నభా 25,000 నుిండి 22,500 కు త్గగింది. అయితే\n      త్గుగద్ల శాత్ిం","options":[{"label":"1","text":"5%"},{"label":"2","text":"8%"},{"label ":"2","text":"60%"},{"label":"3","text":"80%"},{"label":"4","text":"90%"}],"answer":3},{"n":167,"body":"A shopkeeper buys 60 articles for ₹2400 and sells them\n      for a profit of 15%. The selling price of one article is\n      ఒక్ దుకాణద్వరుడు 60 వసుతవులను ₹2400 కు క్కని 15% లాభానికి\n      అమిమతే, ఒక్ వసుతవు అమిమన వెల","options":[{"label":"1","text":"₹40"},{"label":"2","text":"₹42"},{"label":"3","text":"₹44"},{"label":"4","text":"₹46"}],"answer":4},{"n":168,"body":"A person bought a pair of skates at a sale where the\n      discount given was 20%. If the amount he pays is\n      ₹1600, the marked price is\n      ఒక్ వయకిత ఒక్ జత్ స్తకటీను 20% రుసుముపై ₹1600 కి క్కింటే, వాటి\n      ప్రక్టన వెల","options":[{"label":"1","text":"₹1750"},{"label":"2","text":"₹1800"},{"label":"3","text":"₹1900"},{"label":"4","text":"₹2000"}],"answer":4},{"n":169,"body":"The rate that gives ₹280 as simple interest on a sum of\n      ₹56000 in 2 year is\n      2 సింవత్ురాలలో ₹56000 మొత్తింపై ఈ రేటున ₹280 బారువడీీ ని\n      ఇసుతింది","options":[{"label":"1","text":"0.25%"},{"label":"2","text":"0.5%"},{"label":"3","text":"0.75%"},{"label":"4","text":"1.25%"}],"answer":1},{"n":170,"body":"If a person pays simple interest of ₹750 for 2 years on a\n      sum of ₹4500, then the rate of interest is\n      ఒక్ వయకిత ₹4500 మొత్తిం పై 2 సింవత్ురాలకు ₹750 బారువడీీని\n      చ్చలిీస్తత వడీీరేటు\n                  1","options":[{"label":"1","text":"8 %\n                  2\n                  1"},{"label":"2","text":"8 %\n                  3\n                  1"},{"label":"3","text":"8 %\n                  4\n                  1"},{"label":"4","text":"8 %\n                  5"}],"answer":2},{"n":171,"body":"On a certain sum the simple interest paid after 3 years is\n      ₹450 at 5% rate of interest per annum. The sum is\n      క్కింత్ మొత్తింపై 5% వడీీరేటుతో 3 సింవత్ురాల త్రాాత్ చ్చలిీించిన\n      సర్ళ వడీీ ₹450 అయితే, అసలు","options":[{"label":"1","text":"₹3,000"},{"label":"2","text":"₹3,500"},{"la etric lines of a square is\n      ఒక్ చతర్స్రానికి గల రేఖా సౌషటవాల సింఖ్య","options":[{"label":"1","text":"1"},{"label":"2","text":"2"},{"label":"3","text":"3"},{"label":"4","text":"4"}],"answer":4},{"n":231,"body":"The difference between 40° and its complementary\n      angle is\n      40° మరియు ద్వని పూర్క్ కోణముల మధ్య భేద్ిం","options":[{"label":"1","text":"50°"},{"label":"2","text":"40°"},{"label":"3","text":"20°"},{"label":"4","text":"10°"}],"answer":4},{"n":232,"body":"In ∆𝑃𝑄𝑅 if ∠𝑄 = 25° and ∠𝑅 = 65° then which of\n      the following is true\n      ∆𝑃𝑄𝑅 నిందు ∠𝑄 = 25° మరియు ∠𝑅 = 65° అయితే ఈ క్రింది\n      వానిలో ఏది సత్యము","options":[{"label":"1","text":"𝑃𝑄2 + 𝑄𝑅2 = 𝑅𝑃2"},{"label":"2","text":"𝑃𝑄2 + 𝑅𝑃2 = 𝑄𝑅2"},{"label":"3","text":"𝑅𝑃2 + 𝑄𝑅2 = 𝑃𝑄2"},{"label":"4","text":"2𝑄𝑅2 = 3𝑃𝑄2"}],"answer":2},{"n":233,"body":"In ∆𝐴𝐵𝐶 if 𝐴𝐵2 = 𝐵𝐶 2 − 𝐴𝐶 2 then which of the\n     following is true\n     ∆𝐴𝐵𝐶 నిందు 𝐴𝐵2 = 𝐵𝐶 2 − 𝐴𝐶 2 అయితే ఈ క్రింది వానిలో\n      ఏది సత్యము","options":[{"label":"1","text":"∠𝐴 = 90°"},{"label":"2","text":"∠𝐵 = 90°"},{"label":"3","text":"∠𝐶 = 90°"},{"label":"4","text":"∠𝐵 = 120°"}],"answer":1},{"n":234,"body":"If the hypotenuse of a right-angled isosceles triangle is\n      6𝑐𝑚 then one of the its equal side is (𝑖𝑛 𝑐𝑚)\n      ఒక్ సమదిాబాహు లింబకోణ త్రిభుజము యొక్క క్ర్ణము 6 సిం. మీ\n      అయితే మిగలిన రిండు సమ్యన భుజములలో ఒక్ భుజము క్కలత్\n      (సిం. మీ లలో)","options":[{"label":"1","text":"3"},{"label":"2","text":"3√2"},{"label":"3","text":"4"},{"label":"4","text":"4√2"}],"answer":2},{"n":235,"body":"In ∆𝑃𝑄𝑅, ∠𝑃 = 90°if 𝑃𝑄 = 10𝑐𝑚 and 𝑃𝑅 = 24𝑐𝑚\n      then 𝑄𝑅 =\n      ∆𝑃𝑄𝑅 నిందు∠𝑃 = 90°, 𝑃𝑄 = 10సిం. మీ మరియు\n      𝑃𝑅 = 24సిం. మీ అయితే 𝑄𝑅 =","options":[{"label":"1","text":"25"},{"label":"2","text":"26"},{"label":"3","text":"28"},{"label":"4","text":"30"}],"answer":2},{"n":236,"body":"If angles of a triangle are in the ratio 2:3:4, then largest\n      angle is\n      త్రిభుజిం యొక్క కోణలు 2:3:4 నిషపతితలో వుింటే గరిషట కోణిం","options":[{"label":"1","text":"20°"},{"label":"2","text":"40°"},{"label":"3","text":"60°"},{"label":"4","text":"80°"}],"answer":4},{"n":237,"body":"In ∆𝐴𝐵𝐶, if 𝐴𝐵 = 5𝑐𝑚, 𝐵𝐶 = 12𝑐𝑚 and ∠𝐵 = 90°\n      then 𝐴𝐶 =\n      ∆𝐴𝐵𝐶 నిందు 𝐴𝐵 = 5సిం. మీ, 𝐵𝐶 = 12సిం. మీ మరియు\n      ∠𝐵 = 90° అయితే 𝐴𝐶 =","options":[{"label":"1","text":"13"},{"label":"2","text":"14"},{"label":"3","text":"15"},{"label":"4","text":"16"}],"answer":1},{"n":238,"body":"In a right-angled isosceles triangle the ratio of sides\n      can be\n      ఒక్ లింబ కోణ సమదిాబాహు త్రిభుజిం యొక్క భుజముల నిషపతిత","options":[{"label":"1","text":"1:1:3"},{"label":"2","text":"1:1:√3"},{"label":"3","text":"1:1:2"},{"label":"4","text":"1:1: √2"}],"answer":4},{"n":239,"body":"In ∆𝐴𝐵𝐶, 2∠𝐴 = 3∠𝐵 and ∠𝐶 = 90° then ∠𝐴 =\n      ∆𝐴𝐵𝐶 నిందు2∠𝐴 = 3∠𝐵 మరియు∠𝐶 = 90° అయితే ∠𝐴 =","options":[{"label":"1","text":"36°"},{"label":"2","text":"48°"},{"label":"3","text":"54°"},{"label":"4","text":"72°"}],"answer":3},{"n":240,"body":"Sum of all exterior angles of a triangle is\n      త్రిభుజము యొక్క బాహయ కోణల మొత్తిం","options":[{"label":"1","text":"180°"},{"label":"2","text":"270°"},{"label":"3","text":"360°"},{"label":"4","text":"540°"}],"answer":3},{"n":241,"body":"If the sides of a triangle are integers and if two sides of\n      triangle are 6cm and 8cm then maximum possible\n      values for 3rd side is (in cm)\n      పూర్ణ సింఖ్యలు భుజాల క్కలత్లు గా గలిగన త్రిభుజము నిందు\n      రిండు క్కలత్లు వరుసగా 6 సిం. మీ మరియు 8 సిం. మీ అయితే\n      మూడవ భుజమునకు స్థధ్యపడు గరిషట క్కలత్ (సిం. మీ లలో)","options":[{"label":"1","text":"13"},{"label":"2","text":"14"},{"label":"3","text":"15"},{"label":"4","text":"16"}],"answer":1},{"n":242,"body":"In ∆𝐴𝐵𝐶 which of the following is true\n      ∆𝐴𝐵𝐶 నిందు ఈ క్రింది వానిలో ఏది సత్యము","options":[{"label":"1","text":"𝐴𝐵 − 𝐵𝐶 > 𝐴𝐶"},{"label":"2","text":"𝐴𝐵 + 𝐵𝐶 = 𝐴𝐶"},{"label":"3","text":"𝐴𝐵 = 𝐵𝐶 − 𝐴𝐶"},{"label":"4","text":"𝐴𝐵 + 𝐵𝐶 > 𝐴𝐶"}],"answer":4},{"n":243,"body":"If the angles of a triangle are 𝑥°, (𝑥 + 10)° and\n      (𝑥 + 20)° then 𝑥 =\n      ఒక్ త్రిభుజింలో ని క్కణములు వరుసగా 𝑥°, (𝑥 + 10)° మరియు\n      (𝑥 + 20)°అయితే 𝑥 =","options":[{"label":"1","text":"80°"},{"label":"2","text":"70°"},{"label":"3","text":"60°"},{"label":"4","text":"50°"}],"answer":4},{"n":244,"body":"In an Isosceles triangle if one angle is 100° then other\n      two angles are\n      ఒక్ సమదిాబాహు త్రిభుజిం నిందు ఒక్ కోణము 100° అయిన\n      మిగలిన రిండు కోణలు","options":[{"label":"1","text":"40°, 40°"},{"label":"2","text":"50°, 50°"},{"label":"3","text":"100°, 40°"},{"label":"4","text":"60°, 60°"}],"answer":1},{"n":245,"body":"In ∆𝐴𝐵𝐶 if ∠𝐴 + ∠𝐵 = 100° then ∠𝐶 =\n      ∆𝐴𝐵𝐶 నిందు ∠𝐴 + ∠𝐵 = 100°అయితే ∠𝐶 =","options":[{"label":"1","text":"60°"},{"label":"2","text":"70°"},{"label":"3","text":"80°"},{"label":"4","text":"90°"}],"answer":3},{"n":246,"body":"Each external angle of an equilateral triangle is\n      సమబాహు త్రిభుజము యొక్క ప్రతి బాహయ కోణము క్కలత్","options":[{"label":"1","text":"60°"},{"label":"2","text":"120°"},{"label":"3","text":"100°"},{"label":"4","text":"90°"}],"answer":2},{"n":247,"body":"The two interior opposite angles of an exterior angle of\n      a triangle are 60° and 80° then the measure of exterior\n      angle is\n      ఒక్ త్రిభుజ బాహయ కోణిం యొక్క రిండు అింత్రాభి ముఖ్ కోణలు\n      60°మరియు 80° అయిన ఆ బాహయ కోణిం క్కలత్","options":[{"label":"1","text":"90°"},{"label":"2","text":"100°"},{"label":"3","text":"120°"},{"label":"4","text":"140°"}],"answer":4},{"n":248,"body":"In a triangle if the angles are in the ratio 1:2:3 then it is\n      ఒక్ త్రిభుజిం లోని కోణముల నిషపతిత 1:2:3 అయితే ఆ త్రిభుజిం","options":[{"label":"1","text":"Acute triangle              అలపకోణ త్రిభుజిం"},{"label":"2","text":"Obtuse triangle             అధిక్కోణ త్రిభుజిం"},{"label":"3","text":"Right triangle              లింబకోణ త్రిభుజిం"},{"label":"4","text":"Isosceles triangle          సమదిాబాహు త్రిభుజిం"}],"answer":3},{"n":249,"body":"In ∆𝐴𝐵𝐶 if ∠𝐴 + ∠𝐵 = ∠𝐶 then ∠𝐶 is\n       ∆𝐴𝐵𝐶 నిందు ∠𝐴 + ∠𝐵 = ∠𝐶 అయితే ∠𝐶 =","options":[{"label":"1","text":"45°"},{"label":"2","text":"60°"},{"label":"3","text":"75°"},{"label":"4","text":"90°"}],"answer":4},{"n":250,"body":"In ∆𝐴𝐵𝐶 if ∠𝐴 = 70°,∠𝐵 = 50° then ∠𝐶 =\n       ∆𝐴𝐵𝐶 నిందు∠𝐴 = 70°,∠𝐵 = 50° అయితే ∠𝐶 =","options":[{"label":"1","text":"60°"},{"label":"2","text":"40°"},{"label":"3","text":"80°"},{"label":"4","text":"90°"}],"answer":1},{"n":251,"body":"In ∆𝐴𝐵𝐶 if 𝐴𝐵 = 7𝑐𝑚,𝐵𝐶 = 8𝑐𝑚 and 𝐴𝐶 = 9𝑐𝑚\n       then ∆𝐴𝐵𝐶 is\n       ∆𝐴𝐵𝐶 నిందు 𝐴𝐵 = 7సిం. మీ, 𝐵𝐶 = 8సిం. మీ మరియు\n       𝐴𝐶 = 9సిం. మీ అయితే ∆𝐴𝐵𝐶 ఒక్","options":[{"label":"1","text":"Equilateral triangle        సమబాహు త్రిభుజిం"},{"label":"2","text":"Isosceles triangle          సమదిాబాహు త్రిభుజిం"},{"label":"3","text":"Scalene triangle            విషమబాహు త్రిభుజిం"},{"label":"4","text":"Right angled triangle       లింబకోణ త్రిభుజిం"}],"answer":3},{"n":252,"body":"Which of the following measures can make a triangle\n      ఈ క్రింది వానిలో ఏ క్కలత్లు త్రిభుజానిన ఏర్పర్చగలవు","options":[{"label":"1","text":"2𝑐𝑚, 3𝑐𝑚, 5𝑐𝑚"},{"label":"2","text":"4𝑐𝑚, 5𝑐𝑚, 10𝑐𝑚"},{"label":"3","text":"5𝑐𝑚, 5𝑐𝑚, 8𝑐𝑚"},{"label":"4","text":"5𝑐𝑚, 5𝑐𝑚, 10𝑐𝑚"}],"answer":3},{"n":253,"body":"In quadrilateral 𝐴𝐵𝐶𝐷 if 𝐴𝐵 = 𝐵𝐶 and 𝐴𝐷 = 𝐷𝐶\n      then 𝐴𝐵𝐶𝐷 is\n      𝐴𝐵𝐶𝐷 చతరుభజిం నిందు 𝐴𝐵 = 𝐵𝐶 మరియు 𝐴𝐷 = 𝐷𝐶\n      అయితే ఆ చతరుభజము 𝐴𝐵𝐶𝐷 ఒక్","options":[{"label":"1","text":"Trapezium                  సమలింబ చతరుభజము"},{"label":"2","text":"Parallelogram              సమ్యింత్ర్ చతరుభజము"},{"label":"3","text":"Rhombus                    రాింబస్"},{"label":"4","text":"Kite                       గాలిపటము"}],"answer":4},{"n":254,"body":"Each external angle of a regular octagon is\n     ఒక్ క్రమ అషట భుజి యొక్క ప్రతి బాహయ కోణము విలువ","options":[{"label":"1","text":"30°"},{"label":"2","text":"36°"},{"label":"3","text":"45°"},{"label":"4","text":"72°"}],"answer":3},{"n":255,"body":"The length and breadth of a rectangle are 18𝑐𝑚 and\n      8𝑐𝑚 respectively then the side of a square whose area\n      is equal to the area of rectangle is (𝑖𝑛 𝑐𝑚)\n      18 సిం. మీ మరియు 8 సిం. మీ పడవు, వెడలుపలుగ గల\n      దీర్ఘచతర్స్ర వైశాలాయనికి సమ్యన వైశాలయిం గల చతర్స్ర భుజము\n      పడవు (సిం. మీ లలో)","options":[{"label":"1","text":"12"},{"label":"2","text":"14"},{"label":"3","text":"15"},{"label":"4","text":"16"}],"answer":1},{"n":256,"body":"Minimum number of measures required to construct a\n      parallelogram is\n      ఒక్ సమ్యింత్ర్ చతరుభజానిన నిరిమించటానికి అవసర్మగు క్నీస\n      క్కలత్ల సింఖ్య","options":[{"label":"1","text":"4"},{"label":"2","text":"3"},{"label":"3","text":"2"},{"label":"4","text":"5"}],"answer":2},{"n":257,"body":"𝐴𝐵𝐶𝐷 is a rhombus of which ∠𝐴 = 60° and\n       𝐵𝐷 = 5𝑐𝑚 then perimeter of rhombus 𝐴𝐵𝐶𝐷 is\n      (𝑖𝑛 𝑐𝑚)\n      ఒక్ సమ చతరుభజిం(రాింబస్) 𝐴𝐵𝐶𝐷 నిందు\n      ∠𝐴 = 60° మరియు 𝐵𝐷 = 5 సిం. మీ అయితే ఆ సమచతరుభజిం\n      𝐴𝐵𝐶𝐷 చ్చటుట క్కలత్ (సిం. మీ లలో)","options":[{"label":"1","text":"10"},{"label":"2","text":"10√2"},{"label":"3","text":"20"},{"label":"4","text":"20√2"}],"answer":3},{"n":258,"body":"Sum of all exterior angles of a quadrilateral is\n      ఒక్ చతరుభజము యొక్క అనిన బాహయ కోణల మొత్తము","options":[{"label":"1","text":"360°"},{"label":"2","text":"540°"},{"label":"3","text":"720°"},{"label":"4","text":"900°"}],"answer":1},{"n":259,"body":"In a pentagon 𝐴𝐵𝐶𝐷𝐸, ∠𝐴 = ∠𝐵 = ∠𝐶 = ∠𝐷 = 100°\n      then ∠𝐸 =\n      ఒక్ పించ భుజి 𝐴𝐵𝐶𝐷𝐸 నిందు\n       ∠𝐴 = ∠𝐵 = ∠𝐶 = ∠𝐷 = 100° అయితే ∠𝐸 =","options":[{"label":"1","text":"100°"},{"label":"2","text":"110°"},{"label":"3","text":"120°"},{"label":"4","text":"140°"}],"answer":4},{"n":260,"body":"The area of a square whose diagonal is 10𝑐𝑚 is\n      (𝑖𝑛 𝑐𝑚2 )\n      10 సిం. మీ క్ర్ణముగా గల చతర్స్ర వైశాలయిం (చ.సిం. మీ లలో)","options":[{"label":"1","text":"50"},{"label":"2","text":"100"},{"label":"3","text":"150"},{"label":"4","text":"200"}],"answer":1},{"n":261,"body":"If area of a square is 64𝑐𝑚2 then its perimeter is\n      (𝑖𝑛 𝑐𝑚)\n      64 చ.సిం.మీ వైశాలయిం గల చతర్స్రము యొక్క చ్చటుట క్కలత్\n      (సిం. మీ లలో)","options":[{"label":"1","text":"16"},{"label":"2","text":"24"},{"label":"3","text":"32"},{"label":"4","text":"36"}],"answer":3},{"n":262,"body":"The perimeter of a square is 20𝑐𝑚 then its area is\n      (𝑖𝑛 𝑐𝑚2 )\n      ఒక్ చతర్స్రము యొక్క చ్చటుట క్కలత్ 20 సిం. మీ అయితే ఆ\n      చతర్స్ర వైశాలయము (చ.సిం. మీ లలో)","options":[{"label":"1","text":"16"},{"label":"2","text":"25"},{"label":"3","text":"36"},{"label":"4","text":"100"}],"answer":2},{"n":263,"body":"The perimeter of a rectangle is 24𝑐𝑚 and its length is\n      8𝑐𝑚 then its breadth is (𝑖𝑛 𝑐𝑚)\n      ఒక్ దీర్ఘ చతర్స్రము యొక్క చ్చటుట క్కలత్ 24 సిం. మీ మరియు ద్వని\n      పడవు 8 సిం. మీ అయితే ద్వని వెడలుప (సిం. మీ లలో)","options":[{"label":"1","text":"4"},{"label":"2","text":"6"},{"label":"3","text":"16"},{"label":"4","text":"8"}],"answer":1},{"n":264,"body":"The side of a square is 10𝑐𝑚 then its diagonal length is\n      (𝑖𝑛 𝑐𝑚)\n      10 సిం. మీ భుజిం గల చతర్స్ర క్ర్ణము పడవు (సిం. మీ లలో)","options":[{"label":"1","text":"12"},{"label":"2","text":"10√2"},{"label":"3","text":"5√2"},{"label":"4","text":"15"}],"answer":2},{"n":265,"body":"The number of sides of a polygon which has 35\n      diagonals is\n      35 ర్ణములు క్లిగన బహుభుజి యొక్క భుజముల సింఖ్య","options":[{"label":"1","text":"8"},{"label":"2","text":"9"},{"label":"3","text":"10"},{"label":"4","text":"12"}],"answer":3},{"n":266,"body":"A polygon which has same number of sides as well as\n      diagonals is\n      భుజాల సింఖ్య కు సమ్యనింగా క్రాణల సింఖ్య క్లిగన బహుభుజి","options":[{"label":"1","text":"Quadrilateral                చతరుభజము"},{"label":"2","text":"Pentagon                     పించ భుజి"},{"label":"3","text":"Hexagon                      షడుభజి"},{"label":"4","text":"Septagon                     సపతభుజి"}],"answer":2},{"n":267,"body":"Number of diagonals in a hexagon is\n      ఒక్ షడుభజి యిందు క్ల క్ర్ణముల సింఖ్య","options":[{"label":"1","text":"6"},{"label":"2","text":"9"},{"label":"3","text":"10"},{"label":"4","text":"12"}],"answer":2},{"n":268,"body":"The least possible interior angle of a regular polygon is\n      ఒక్ క్రమ బహుభుజి కి అింత్ర్ింగ ఉిండ ద్గన క్నిషట కోణము విలువ","options":[{"label":"1","text":"45°"},{"label":"2","text":"60°"},{"label":"3","text":"90°"},{"label":"4","text":"120°"}],"answer":2},{"n":269,"body":"Each exterior angle of a regular polygon is 60° then\n      the polygon is\n      ఒక్ క్రమ బహుభుజి యొక్క ప్రతి బాహయ కోణిం 60° అయితే ఆ\n      బహుభుజి","options":[{"label":"1","text":"Hexagon             షడుభజి"},{"label":"2","text":"Octagon             అషట భుజి"},{"label":"3","text":"Nonagon             నవభుజి"},{"label":"4","text":"Decagon             ద్శభుజి"}],"answer":1},{"n":270,"body":"Sum of all internal angles of an octagon is\n      ఒక్ అషట భుజి యిందు అింత్ర్ కోణల మొత్తిం","options":[{"label":"1","text":"720°"},{"label":"2","text":"900°"},{"label":"3","text":"1080°"},{"label":"4","text":"1260°"}],"answer":3},{"n":271,"body":"𝐴𝐵𝐶𝐷 is a trapezium in which ̅̅̅̅\n                                   𝐴𝐵 ∥ ̅̅̅̅\n                                        𝐷𝐶 if ∠𝐵 = 80°\n      then ∠𝐶 =\n      𝐴𝐵𝐶𝐷 ఒక్ సమలింబ చతరుభజము లో ̅̅̅̅\n                                     𝐴𝐵 ∥ ̅̅̅̅\n                                          𝐷𝐶 ,\n       ∠𝐵 = 80° అయితే ∠𝐶 =","options":[{"label":"1","text":"80°"},{"label":"2","text":"60°"},{"label":"3","text":"100°"},{"label":"4","text":"120°"}],"answer":3},{"n":272,"body":"In a parallelogram 𝐴𝐵𝐶𝐷 if ∠𝐴 = 100° then ∠𝐶 =\n      𝐴𝐵𝐶𝐷 ఒక్ సమ్యింత్ర్ చతరుభజము, ∠𝐴 = 100° అయితే\n      ∠𝐶 =","options":[{"label":"1","text":"80°"},{"label":"2","text":"90°"},{"label":"3","text":"100°"},{"label":"4","text":"50°"}],"answer":3},{"n":273,"body":"Each internal angle of a regular decagon is\n      ఒక్ క్రమ ద్శభుజి యొక్క ప్రతి అింత్ర్కోణము విలువ","options":[{"label":"1","text":"100°"},{"label":"2","text":"120°"},{"label":"3","text":"144°"},{"label":"4","text":"150°"}],"answer":3},{"n":274,"body":"The founder of the Indian statistical Institute Kolkata\n      is\n      క్లక్తాత లో ఇిండియన్ స్థటిసిటక్ ఇన్ సిట్యయట్   1"},{"label":"3","text":"6\n             5"},{"label":"4","text":"6"}],"answer":1},{"n":336,"body":"Probability of getting an ace from a well shuffled deck\n      of playing cards is\n      బాగా క్లిపిన పేక్ముక్కల నుిండి ఏస్ ముక్కను తీయుటకు గల\n      సింభావయత్\n             1","options":[{"label":"1","text":"4\n              1"},{"label":"2","text":"13\n              2"},{"label":"3","text":"25\n              4"},{"label":"4","text":"53"}],"answer":2},{"n":337,"body":"If 𝑛 = 1 then the value of 2𝑛 =\n      𝑛 = 1 అయితే 2𝑛 యొక్క విలవ","options":[{"label":"1","text":"2"},{"label":"2","text":"3"},{"label":"3","text":"1"},{"label":"4","text":"4"}],"answer":1},{"n":338,"body":"If 𝑛 = 2 then the value of 𝑛 + 2 is\n     𝑛 = 2 అయితే 𝑛 + 2 యొక్క విలవ","options":[{"label":"1","text":"22"},{"label":"2","text":"14"},{"label":"3","text":"7"},{"label":"4","text":"4"}],"answer":4},{"n":339,"body":"If 𝑛 = 3 then the value of 3𝑛 − 3 is\n      𝑛 = 3 అయితే 3𝑛 − 3 యొక్క విలవ","options":[{"label":"1","text":"32"},{"label":"2","text":"23"},{"label":"3","text":"6"},{"label":"4","text":"5"}],"answer":3},{"n":340,"body":"If 𝑛 = 4 then the value of 4(𝑛 − 2) is\n      𝑛 = 4 అయితే 4(𝑛 − 2) యొక్క విలవ","options":[{"label":"1","text":"24"},{"label":"2","text":"8"},{"label":"3","text":"42"},{"label":"4","text":"6"}],"answer":2},{"n":341,"body":"If 𝑥 = 12 then the value of 𝑥 − 3 =\n      𝑥 = 12 అయితే 𝑥 − 3 యొక్క విలవ","options":[{"label":"1","text":"123"},{"label":"2","text":"36"},{"label":"3","text":"15"},{"label":"4","text":"9"}],"answer":4},{"n":342,"body":"If 𝑛 = 3 then the value of 2𝑛 + 3\n      𝑛 = 3 అయితే 2𝑛 + 3 యొక్క విలవ","options":[{"label":"1","text":"9"},{"label":"2","text":"33"},{"label":"3","text":"6"},{"label":"4","text":"0"}],"answer":1},{"n":343,"body":"If 𝑎 = 4 then the value of 4(𝑎 − 1) is\n      𝑎 = 4 అయితే 4(𝑎 − 1) యొక్క విలవ","options":[{"label":"1","text":"34"},{"label":"2","text":"43"},{"label":"3","text":"12"},{"label":"4","text":"7"}],"answer":3},{"n":344,"body":"If 𝑙 = 7 then the value of 3𝑙 =\n      𝑙 = 7 అయితే 3𝑙 యొక్క విలవ","options":[{"label":"1","text":"73"},{"label":"2","text":"21"},{"label":"3","text":"37"},{"label":"4","text":"10"}],"answer":2},{"n":345,"body":"If 𝑦 = 5 then the value of 5(8 − 𝑦) is\n      𝑦 = 5 అయితే 5(8 − 𝑦) యొక్క విలవ","options":[{"label":"1","text":"15"},{"label":"2","text":"35"},{"label":"3","text":"53"},{"label":"4","text":"8"}],"answer":1},{"n":346,"body":"If 𝑝 = 3 then the value of 𝑝(𝑝 + 2)\n      𝑝 = 3 అయితే 𝑝(𝑝 + 2) యొక్క విలవ","options":[{"label":"1","text":"8"},{"label":"2","text":"15"},{"label":"3","text":"35"},{"label":"4","text":"53"}],"answer":2},{"n":347,"body":"If 𝑚 = 4 then the value of (9 − 𝑚)𝑚\n      𝑚 = 4 అయితే (9 − 𝑚)𝑚 యొక్క విలవ","options":[{"label":"1","text":"45"},{"label":"2","text":"54"},{"label":"3","text":"20"},{"label":"4","text":"9"}],"answer":3},{"n":348,"body":"If 𝑥 = 5 then the value of 10 + 𝑥 =\n      𝑥 = 5 అయితే 10 + 𝑥 యొక్క విలవ","options":[{"label":"1","text":"15"},{"label":"2","text":"105"},{"label":"3","text":"50"},{"label":"4","text":"51"}],"answer":1},{"n":349,"body":"If 𝑥 = 7 then the value of 10 − 𝑥 =\n      𝑥 = 7 అయితే 10 − 𝑥 యొక్క విలవ","options":[{"label":"1","text":"17"},{"label":"2","text":"107"},{"label":"3","text":"13"},{"label":"4","text":"3"}],"answer":4},{"n":350,"body":"If 𝑧 = 12 then the value of 𝑧 − 12 =\n      𝑧 = 12 అయితే 𝑧 − 12 యొక్క విలవ","options":[{"label":"1","text":"0"},{"label":"2","text":"12"},{"label":"3","text":"24"},{"label":"4","text":"6"}],"answer":1},{"n":351,"body":"The expression which represents “3 exceeds x” is\n      “x క్ింటే 3 ఎకుకవ” అనే సింబింధానిన స్కచిించ్చ సమ్యసిం","options":[{"label":"1","text":"3−𝑥"},{"label":"2","text":"3𝑥"},{"label":"3","text":"𝑥 − 3"},{"label":"4","text":"𝑥 + 3"}],"answer":4},{"n":352,"body":"If a teacher gives 3 pencils per students, then the\n      expression which represents the number of pencils\n      given to ‘𝑠’ students is\n      ఒక్ ఉపాధాయయుడు ఒక్కకక్క విద్వయరిాకి 3 పెనిుళ్లీ ఇచిునటెలీతే ‘𝑠’\n      విద్వయరుాలకు ఇచిున పెనిులీ సింఖ్యను స్కచిించ్చ సమ్యసిం","options":[{"label":"1","text":"3𝑠"},{"label":"2","text":"𝑠 + 3"},{"label":"3","text":"𝑠 − 3"},{"label":"4","text":"3 − 𝑠"}],"answer":1},{"n":353,"body":"If there are 5 cadets in a row in a parade, then the\n      number of cadets needed to arrange in ‘n’ rows in that\n      parade is\n      ఒక్ పెరేడ్ నిందు ఒక్ వరుసకు 5 గురు కాయడెటుీ ఉననటీయితే, ఆ\n      పెరేడ్ నిందు ‘n’ వరుసలలో అమరుుటకు అవసర్మగు కాయడెటీ\n      సింఖ్య","options":[{"label":"1","text":"5 + 𝑛"},{"label":"2","text":"5𝑛"},{"label":"3","text":"𝑛 + 5"},{"label":"4","text":"𝑛 − 5"}],"answer":2},{"n":354,"body":"If there are 50 mangoes in a box, how many mangoes\n      are there in ‘𝑏’ such boxes?\n      ఒక్ పెటటలో 50 మ్యమిడి పిండుీ ఉింటే అటువింటి‘𝑏’ పెటెటల యిందు\n      ఎనిన మ్యమిడి పిండుీ ఉింటాయి","options":[{"label":"1","text":"50 − 𝑏"},{"label":"2","text":"50 + 𝑏"},{"label":"3","text":"50𝑏"},{"label":"4","text":"𝑏 − 50"}],"answer":3},{"n":355,"body":"If a bird flies 1 kilo meter in one minute, then the\n       distance covered by the bird in ‘𝑡’ minutes is ___km\n       ఒక్ పక్షి ఒక్ నిమిషములో 1 కిలోమీటరు దూర్ిం ఎగరితే, ‘𝑡’\n       నిమిష్టలలో ఆ పక్షి ప్రయాణించగలిగే దూర్ిం___ కి.మీ","options":[{"label":"1","text":"𝑡 − 1"},{"label":"2","text":"1 + 𝑡"},{"label":"3","text":"1 − 𝑡"},{"label":"4","text":"𝑡"}],"answer":4},{"n":356,"body":"Radha is drawing a dot Rangoli with chalk powder.\n      She has 9 dots in a row. How many dots will her\n      Rangoli have for ‘𝑟’ rows?\n      రాధ్ ముగుగ పిిండి తో చ్చక్కల ముగుగ గీసుతింది. అిందులో ఒక్ అడుీ\n       వరుసకి 9 చ్చక్కలు ఉన్ననయి. ‘𝑟’ అడీవరుసలకు ఆమె ముగుగలో\n       ఎనిన చక్కలు ఉింటాయి?","options":[{"label":"1","text":"9 − 𝑟"},{"label":"2","text":"9𝑟"},{"label":"3","text":"9 + 𝑟"},{"label":"4","text":"𝑟 + 9"}],"answer":2},{"n":357,"body":"In a family function, mother distributed ‘𝑙’ laddus and\n       still 5 laddus remain. How many total laddus she have\n       before distribution?\n       ఒక్ కుటుింబ కార్యక్రమింలో త్లిీ ‘𝑙’ లడూీలు పించిింది. ఇింక్నూ 5\n       లడూీలు మిగలినవి. పించడానికి ముిందు ఆమె వద్ద మొత్తిం ఎనిన\n       లడూీలు ఉిండేవి?","options":[{"label":"1","text":"𝑙 + 5"},{"label":"2","text":"𝑙 − 5"},{"label":"3","text":"5𝑙"},{"label":"4","text":"5 − 𝑙"}],"answer":1},{"n":358,"body":"The variable used in this given expression 3𝑥 2 − 5 is\n       3𝑥 2 − 5 అనే ఇవాబడిన సమ్యసిం నిందు వాడబడిన చర్రాశి?","options":[{"label":"1","text":"2"},{"label":"2","text":"-5"},{"label":"3","text":"3"},{"label":"4","text":"𝑥"}],"answer":4},{"n":359,"body":"How many terms are there in the expression 4𝑥𝑦 + 7 ?\n     4𝑥𝑦 + 7 అనే సమ్యసిం నిందు ఎనిన పద్వలు ఉన్ననయి?","options":[{"label":"1","text":"4"},{"label":"2","text":"1"},{"label":"3","text":"2"},{"label":"4","text":"3"}],"answer":3},{"n":360,"body":"What are the variables we can find in 4𝑥𝑦 + 7 ?\n      4𝑥𝑦 + 7 అను సమ్యసిం నిందు గల చర్రాశులు ఏవి?","options":[{"label":"1","text":"4, 𝑥, 𝑦"},{"label":"2","text":"𝑥, 𝑦"},{"label":"3","text":"4, 𝑥, 𝑦, 7"},{"label":"4","text":"4, 7"}],"answer":2},{"n":361,"body":"How many terms are there in the algebraic expression\n      4𝑥 2 − 3𝑥𝑦 + 5 ?\n      4𝑥 2 − 3𝑥𝑦 + 5 అనే బీజీయ సమ్యసిం నిందు ఎనిన పద్వలు\n      ఉననవి?","options":[{"label":"1","text":"3"},{"label":"2","text":"6"},{"label":"3","text":"2"},{"label":"4","text":"4"}],"answer":1},{"n":362,"body":"The numerical co-efficient of 𝑥 2 in the algebraic\n      expression 4𝑥 2 − 3𝑥𝑦 is\n      4𝑥 2 − 3𝑥𝑦 నిందు 𝑥 2 యొక్క సింఖాయ గుణక్ిం","options":[{"label":"1","text":"4"},{"label":"2","text":"-3"},{"label":"3","text":"1"},{"label":"4","text":"4𝑥"}],"answer":1},{"n":363,"body":"What is the numerical co-efficient of 𝑥 in the term\n      −3𝑥𝑦 ?\n      −3𝑥𝑦 అను పద్ిం నిందు 𝑥 యొక్క సింఖాయ గుణక్ిం ఏది?","options":[{"label":"1","text":"3"},{"label":"2","text":"-3y"},{"label":"3","text":"y"},{"label":"4","text":"-3"}],"answer":4},{"n":364,"body":"Which of the following is not a factor of −3𝑥𝑦 ?\n      −3𝑥𝑦 కు ఈ క్రింది వానిలో ఏది ఒక్ కార్ణింక్ిం కా "text":"1500"},{"label":"4","text":"1000"}],"answer":3},{"n":422,"body":"Two sides of a triangle are 12 cm and 14cm. The\n      perimeter of a triangle is 36cm. It’s third side is\n      (in cm.)\n      ఒక్ త్రిభుజిం యొక్క రిండు భుజాలు 12సిం. మీ. మరియు 14 సిం.\n      మీ. త్రిభుజిం యొక్క చ్చటుటక్కలత్ 36 సిం. మీ. అయిన ద్వని మూడవ\n      భుజిం (సిం. మీ.లో)","options":[{"label":"1","text":"10"},{"label":"2","text":"15"},{"label":"3","text":"12"},{"label":"4","text":"14"}],"answer":1},{"n":423,"body":"The area of the square plot of side 8m is (in sq.m.)\n      8 మీ. భుజిం పడవు గల ఒక్ చతర్స్రాకార్పు పాీట్ (సాలిం) యొక్క\n      వైశాలయిం (చ.మీ.లో)","options":[{"label":"1","text":"16"},{"label":"2","text":"32"},{"label":"3","text":"24"},{"label":"4","text":"64"}],"answer":4},{"n":424,"body":"The cost of tiling a rectangular plot of land 500m long\n      and 200m wide at the rate of ₹8 per square meter (in ₹)\n      is\n      చ. మీ. ₹8 చొప్పున పడవు 500 మీ. మరియు వెడలుప 200 మీ.\n      క్లిగన దీర్ఘచతర్స్రాకార్ భూమిని టైలిింగ్స చేయడానికి అయ్యయ ఖ్రుు\n      (₹ లలో)","options":[{"label":"1","text":"80,000"},{"label":"2","text":"8,00,000"},{"label":"3","text":"80,00,000"},{"label":"4","text":"8,000"}],"answer":2},{"n":425,"body":"The area of a parallelogram whose base is 20cm and\n      height is 15cm (in sq. cm) is\n      20 సిం. మీ. భూమి మరియు 15 సిం. మీ. ఎతత క్లిగన సమ్యింత్ర్\n      చతరుభజ వైశాలయిం (చ. సిం. మీ. లలో)","options":[{"label":"1","text":"150"},{"label":"2","text":"70"},{"label":"3","text":"300"},{"label":"4","text":"75"}],"answer":3},{"n":426,"body":"The base of the triangle whose area is 36cm2 and the\n      height 3cm is (in cm.)\n      36 సిం. మీ2 వైశాలయిం మరియు 3 సిం. మీ. ఎతత క్లిగన త్రిభుజిం\n      యొక్క భూమి (సిం. మీ.లో)","options":[{"label":"1","text":"24"},{"label":"2","text":"12"},{"label":"3","text":"48"},{"label":"4","text":"32"}],"answer":1},{"n":427,"body":"The perimeter of a 12 cm long sided equilateral triangle\n      (in cm.) is\n\n      12 సిం. మీ. భుజిం పడవుగాగల సమబాహు త్రిభుజ చ్చటుటక్కలత్","options":[{"label":"1","text":"144"},{"label":"2","text":"24"},{"label":"3","text":"48"},{"label":"4","text":"36"}],"answer":4},{"n":428,"body":"If the area of a parallelogram is 24 cm2 and the base is\n      4 cm, then its height (in cm) is\n      ఒక్ సమ్యింత్ర్ చతరుభజిం యొక్క వైశాలయిం 24 చ. సిం. మీ.\n      మరియు ద్వని భూమి పడవు 4 సిం. మీ. అయితే ఆ సమ్యింత్ర్\n      చతరుభజ ఎతత (సిం. మీ.లో )","options":[{"label":"1","text":"12"},{"label":"2","text":"6"},{"label":"3","text":"18"},{"label":"4","text":"8"}],"answer":2},{"n":429,"body":"The cost of fencing a rectangular park of length 175 m\n      and breadth 125 m at the rate of ₹12 per metre is\n      175 మీ. పడవు మరియు 125 మీ వెడలుప క్లిగన దీర్ఘచతర్స్రాకార్\n      పారుకకు మీటర్కు ₹12 చొప్పున క్ించ్చ వేయడానికి అయ్యయ ఖ్రుు","options":[{"label":"1","text":"₹600"},{"label":"2","text":"₹3,600"},{"label":"3","text":"₹7,200"},{"label":"4","text":"₹5,400"}],"answer":3},{"n":430,"body":"A piece of string is 30cm long. The length of each side,\n      if the string is used to form a regular hexagon (in cm) is\n      ఒక్ తీగ ముక్క పడవు 30 సిం. మీ. ఒక్ వేళ ఈ తీగను ఒక్ క్రమ\n      షడుభజిగా మ్యరుుటకు ఉపయోగించినటెలీతే ద్వని ప్రతి భుజిం పడవు\n      (సిం. మీ.లో)","options":[{"label":"1","text":"180"},{"label":"2","text":"6"},{"label":"3","text":"10"},{"label":"4","text":"5"}],"answer":4},{"n":431,"body":"The perimeter of an isosceles triangle with equal sides\n      8cm each and third side 6cm is (in cm)\n      సమ్యన భుజాలు 8 సిం. మీ. మరియు మూడవ భుజిం క్కలత్ 6 సిం.\n      మీ. గాగల సమదిాబాహు త్రిభుజ చ్చటుటక్కలత్ (సిం. మీ.లలో)","options":[{"label":"1","text":"22"},{"label":"2","text":"23"},{"label":"3","text":"14"},{"label":"4","text":"24"}],"answer":1},{"n":432,"body":"The area of a trapezium whose parallel sides are 9cm\n      and 7 cm and the perpendicular distance between them\n      of 3cm is (cm2)\n      9 సిం. మీ. మరియు 7 సిం. మీ. సమ్యింత్ర్ భుజాలను క్లిగ మరియు\n      వాటి మధ్య లింబ దూర్ము 3 సిం. మీ. అయిన సమలింబ చతరుభజ\n      వైశాలయము (చ. సిం. మీ.లో)","options":[{"label":"1","text":"12"},{"label":"2","text":"48"},{"label":"3","text":"24"},{"label":"4","text":"36"}],"answer":3},{"n":433,"body":"The area of a rhombus whose diagonals of lengths 10\n      cm and 8.2 cm is (in cm2)\n      క్ర్ణముల పడవులు 10 సిం. మీ. మరియు 8.2 సిం. మీ. గల రాింబస్\n       వైశాలయము (చ. సిం. మీ.లో)","options":[{"label":"1","text":"82"},{"label":"2","text":"41"},{"label":"3","text":"36.4"},{"label":"4","text":"48"}],"answer":2},{"n":434,"body":"The area of a quadrilateral whose length of a diagonal\n      is 6 cm and the lengths of perpendiculars drawn from\n      the opposite vertices to that diagonal are 3cm and 5cm\n      is (in cm2)\n      6 సిం. మీ. క్ర్ణిం పడవు మరియు ఆ క్ర్ణిం పైకి ఎదుటి శీరాిల నుిండి\n       గీచిన లింబముల పడవులు 3 సిం. మీ. మరియు 5 సిం. మీ. గాగల\n       చతరుభజ వైశాలయము (చ. సిం. మీ.లో)","options":[{"label":"1","text":"45"},{"label":"2","text":"90"},{"label":"3","text":"48"},{"label":"4","text":"24"}],"answer":4},{"n":435,"body":"If the area of a square is 64cm2. Then the perimeter of\n      the square is (in cm)\n      ఒక్ చతర్స్ర వైశాలయిం 64 చ. సిం. మీ. అయితే ద్వని చ్చటుటక్కలత్\n       (సిం. మీ.లలో)","options":[{"label":"1","text":"128"},{"label":"2","text":"32"},{"label":"3","text":"8"},{"label":"4","text":"16"}],"answer":2},{"n":436,"body":"If the length and breadth of a rectangular field are in the\n      ratio 3:2 and the perimeter of that field is 200 cm. Then\n      the measures of length and breadth respectively are (in\n      cm)\n      ఒక్ దీర్ఘ చతర్స్రాకార్ పలము పడవు మరియు వెడలుపల నిషపతిత 3:2\n       మరియు ద్వని చ్చటుట క్కలత్ 200 మీ. అయితే ద్వని పడవు మరియు\n       వెడలుపల క్కలత్లు వరుసగా (సిం. మీ.లలో)","options":[{"label":"1","text":"60, 40"},{"label":"2","text":"50, 50"},{"label":"3","text":"40, 60"},{"label":"4","text":"65, 35"}],"answer":1},{"n":437,"body":"The area of a trapezium shape field is 480m2. The\n      distance between the parallel sides is 15m and one of\n      the parallel side is 20m. Then the other parallel side is\n      (in m)\n      ట్రెపీజియిం ఆకార్ింలో వునన ఒక్ పలము వైశాలయిం 480 చ. మీ.\n      రిండు సమ్యింత్ర్ భుజాల మధ్య దూర్ము 15 మీ. మరియు ఒక్\n      సమ్యింత్ర్ భుజిం యొక్క పడవు 20 మీ. అయినచో రిండవ\n      సమ్యింత్ర్ భుజిం పడవు (మీ. లలో)","options":[{"label":"1","text":"12"},{"label":"2","text":"32"},{"label":"3","text":"24"},{"label":"4","text":"44"}],"answer":4},{"n":438,"body":"The perimeter of a regular pentagon with each side\n      measuring 3 cm is (in cm)\n      3 సిం. మీ. భుజము గాగల క్రమ పించభుజి యొక్క చ్చటుటక్కలత్\n      (సిం. మీ.లలో)","options":[{"label":"1","text":"9"},{"label":"2","text":"12"},{"label":"3","text":"15"},{"label":"4","text":"18"}],"answer":3},{"n":439,"body":"If the sides of two squares are in the ratio 4:5 then the\n      ratio of their areas is\n      రిండు చతర్స్రాల భుజాల నిషపతిత 4:5 అయితే వాటి వైశాలాయల నిషపతిత","options":[{"label":"1","text":"16:25"},{"label":"2","text":"4:5"},{"label":"3","text":"16:20"},{"label":"4","text":"2:√5"}],"answer":1},{"n":440,"body":"A parallelogram and a rectangle have same areas. Then\n      one the following statements is always true\n      ఒక్ సమ్యింత్ర్ చతరుభజిం మరియు ఒక్ దీర్ఘ చతర్స్రిం సమ్యన\n      వైశాలాయలు క్లిగ ఉన్ననయి. అయిన క్రింది వానిలో ఎలీప్పుడూ సరైన\n      వాక్యిం","options":[{"label":"1","text":"Perimeter of rectangle is greater than the\n              perimeter of parallelogram.\n              దీర్ఘచతర్స్ర చ్చటుట క్కలత్ సమ్యింత్ర్ చతరుభజ చ్చటుటక్కలత్\n              క్న్నన ఎకుకవ"},{"label":"2","text":"The perimeters of rectangle and parallelogram\n              are equal.\n              దీర్ఘచతర్స్ర    మరియు   సమ్యింత్ర్ చతరుభజాల\n              చ్చటుటక్కలత్లు సమ్యనిం"},{"label":"3","text":"The perimeter of parallelogram is greater than the\n              perimeter of rectangle.\n              సమ్యింత్ర్ చతరుభజ చ్చటుటక్కలత్ దీర్ఘచతర్స్ర చ్చటుటక్కలత్\n              క్న్నన ఎకుకవ"},{"label":"4","text":"The perimeter of rectangle is twice that of\n              parallelogram.\n              దీర్ఘచతర్స్ర    చ్చటుటక్కలత్, సమ్యింత్ర్ చతరుభజ\n              చ్చటుటక్కలత్కు రటిటింపు"}],"answer":3},{"n":441,"body":"Pinky runs around a square field of side 75m and Bob\n      runs around a rectangular filed with length 160m and\n      breadth 105 m. With this information one of the\n      following is a correct statement.\n      పిింకీ 75 మీ. భుజిం గల చతర్స్రాకార్ పలిం చ్చట్యట పరుగెతత ింది.\n      బాబ్ 160 మీ. పడవు మరియు 105మీ. వెడలుపగల\n      దీర్ఘచతర్స్రాకార్ పలిం చ్చట్యట పరుగెతాతడు. ఇచిున సమ్యచార్ిం\n      ఆధార్ింగా సరైన సమ్యధానిం.","options":[{"label":"1","text":"Bob covers more distance by 230m.\n              బాబ్ 230 మీ. ఎకుకవ దూరానిన పరుగెతాతడు."},{"label":"2","text":"Pinky covers more distance by 230m.\n              పిింకీ 230 మీ. ఎకుకవ దూరానిన పరుగెతితింది."},{"label":"3","text":"Bob covers more distance by 115m.\n              బాబ్ 115 మీ. ఎకుకవ దూరానిన పరుగెతాతడు."},{"label":"4","text":"Pinky covers more distance by 35m.\n              పిింకీ 35 మీ. ఎకుకవ దూరానిన పరుగెతితింది."}],"answer":1},{"n":442,"body":"If the circumference of a circular sheet 154m, then the\n      area of sheet is (𝑖𝑛 𝑚2 )\n      ఒక్ వృతాతకార్ షీట్ యొక్క చ్చటుటక్కలత్ 154 మీ అయితే షీట్\n      యొక్క వైశాలయిం (చ. మీ లలో)","options":[{"label":"1","text":"2532.3"},{"label":"2","text":"1794.5"},{"label":"3","text":"1886.5"},{"label":"4","text":"1983.5"}],"answer":3},{"n":443,"body":"Which of the following letters have same image in\n     mirror\n     అద్దింలో ఒకేలా ప్రతి బిింబానిన క్లిగ వుిండే అక్షరాలు ఏవి?","options":[{"label":"1","text":"A"},{"label":"2","text":"H"},{"label":"3","text":"X"},{"label":"4","text":"All of the above            పైవనీన"}],"answer":4},{"n":444,"body":"Number of symmetrical lines of an isosceles triangle is\n      ఒక్ సమదిాబాహు త్రిభుిం యొక్క సౌషటవాక్షాల సింఖ్య","options":[{"label":"1","text":"3"},{"label":"2","text":"1"},{"label":"3","text":"2"},{"label":"4","text":"4"}],"answer":2},{"n":445,"body":"Number of symmetrical lines of a regular Heptagon is\n      క్రమ సపతభుజి యొక్క సౌషటవాక్షాల సింఖ్య","options":[{"label":"1","text":"6"},{"label":"2","text":"7"},{"label":"3","text":"5"},{"label":"4","text":"8"}],"answer":2},{"n":446,"body":"Which of the following figure has a rotational\n      symmetry of order 4\n      క్రింది వానిలో 4 వ పరిమ్యణ భ్రమణ సౌషటవానిన క్లిగ వునన పటము","options":[{"label":"1","text":"Rectangle                   దీర్ఘచతర్స్రము"},{"label":"2","text":"Square                      చతర్స్రము"},{"label":"3","text":"Equilateral triangle        సమబాహూ త్రిభుజిం"},{"label":"4","text":"Circle                      వృత్తిం"}],"answer":2},{"n":447,"body":"In which case is it not possible to form a polygon with\n      క్రింది ఏ సింద్ర్భముతో బహుభుజిలను ఏర్పర్ుడానికి స్థధ్యిం కాదు","options":[{"label":"1","text":"Five match sticks               ఐదు అగగపులీలు"},{"label":"2","text":"Four match sticks               న్నలుగు అగగపులీలు"},{"label":"3","text":"Three match sticks              మూడు అగగపులీలు"},{"label":"4","text":"Two match sticks                రిండు అగగపులీలు"}],"answer":4},{"n":448,"body":"Name of the polygon with 8 sides is\n      8 భుజాల గల బహుభుజి పేరు","options":[{"label":"1","text":"Hexagon                షడుభజి"},{"label":"2","text":"Octagon                అషటభుజి"},{"label":"3","text":"Heptagon               సపతభుజి"},{"label":"4","text":"Decagon                ద్శభుజి"}],"answer":2},{"n":449,"body":"From a circular sheet of radius 4cm, circle of radius\n       3cm is removed the area of the remaining sheet is\n       (𝑖𝑛 𝑐𝑚2 )\n       4 సిం. మీ వాయస్థర్్ిం వునన వృతాతకార్ షీట్ నుిండి 3 సిం. మీ\n       వాయస్థర్్ిం వునన వృత్తిం తీసివేయబడిింది మిగలిన షీట్ యొక్క\n       వైశాలయిం (చ. సిం. మీ లలో)","options":[{"label":"1","text":"7𝜋"},{"label":"2","text":"𝜋"},{"label":"3","text":"3𝜋"},{"label":"4","text":"5𝜋"}],"answer":1},{"n":450,"body":"The minute hand of a circular clock is 14cm long the\n      distance between that tip of the minute hand move in 1\n      hour (in cm)\n      వృతాతకార్ గడియార్ిం యొక్క నిమిష్టల ములుీ పడువు 14 సిం.మీ\n       నిమిష్టల ములుీ యొక్క క్కన 1 గింటలో క్ద్లగలిగే దూర్ిం\n       (సిం.మీ లలో)","options":[{"label":"1","text":"44"},{"label":"2","text":"88"},{"label":"3","text":"96"},{"label":"4","text":"124"}],"answer":2},{"n":451,"body":"The number of times a wheel of radius 28cm must\n      rotate to go 352cm is\n      28 సిం. మీ వాయస్థర్్ిం వునన చక్రిం 352 సిం.మీ వెళాీలింటే అది\n      తిరుగు వలసిన చ్చటీ సింఖ్య","options":[{"label":"1","text":"4"},{"label":"2","text":"3"},{"label":"3","text":"5"},{"label":"4","text":"2"}],"answer":4},{"n":452,"body":"The angle of rotation of an equilateral triangle is\n      ఒక్ సమబాహు త్రిభుజిం యొక్క భ్రమణ కోణిం విలువ","options":[{"label":"1","text":"60°"},{"label":"2","text":"90°"},{"label":"3","text":"120°"},{"label":"4","text":"180°"}],"answer":3},{"n":453,"body":"The part of a revolution you have turned through if\n      you stand facing east and turn clock-wise to face north\n      is\n      తూరుప దిశ వైపు మీ ముఖ్ిం వున్నన సవయదిశలో ఉత్తర్ ముఖ్ింగా\n      తిరిగనపుడు మీరు తిరిగన భ్రమణ భాగము\n             3","options":[{"label":"1","text":"4\n             1"},{"label":"2","text":"4\n             1"},{"label":"3","text":"2\n             4"},{"label":"4","text":"5"}],"answer":1},{"n":454,"body":"Number of diagonals that can be drawn to a pentagon\n      is\n      ఒక్ పించభుజి కి గీయగల క్రాణల సింఖ్య","options":[{"label":"1","text":"8"},{"label":"2","text":"6"},{"label":"3","text":"5"},{"label":"4","text":"10"}],"answer":3},{"n":455,"body":"Area of a semi-circle whose diameter is 14cm is\n      (𝑖𝑛 𝑐𝑚2 )\n      14 సిం.మీ వాయసిం గాగల అర్్ వృత్త వైశాలయిం (చ.సిం.మీ లలో)","options":[{"label":"1","text":"77"},{"label":"2","text":"154"},{"label":"3","text":"308"},{"label":"4","text":"616"}],"answer":1},{"n":456,"body":"The perimeter of a semicircle of radius 14cm is\n      (𝑖𝑛 𝑐𝑚)\n      14 సిం.మీ వాయస్థర్్ిం గాగల అర్్వృత్తచ్చటుటక్కలత్ (సిం.మీలలో)","options":[{"label":"1","text":"144"},{"label":"2","text":"72"},{"label":"3","text":"44"},{"label":"4","text":"36"}],"answer":2},{"n":457,"body":"The perimeter of the circle of diameter 28cm is\n      (in cm)\n      28 సిం.మీ వాయసిం గాగల వృత్త పరిధి (సిం.మీలలో)","options":[{"label":"1","text":"88"},{"label":"2","text":"176"},{"label":"3","text":"44"},{"label":"4","text":"144"}],"answer":1},{"n":458,"body":"Name the polygon which has equal number of sides\n      and diagonals\n      భుజాల సింఖ్య మరియు క్రాణల సింఖ్య సమ్యనింగా గల బహుభుజి\n      పేరు","options":[{"label":"1","text":"Square                చతర్స్రిం"},{"label":"2","text":"Hexagon               షడుభజి"},{"label":"3","text":"Octagon               అషటభుజి"},{"label":"4","text":"Pentagon              పించభుజి"}],"answer":4},{"n":459,"body":"Which of the following letter has rotational symmetry\n       of order 2\n       క్రింది వానిలో ఏ అక్షరాలు ‘2’ పరిమ్యణిం గల భ్రమణ సౌషటవానిన\n       క్లిగ ఉన్ననయి","options":[{"label":"1","text":"Z"},{"label":"2","text":"H"},{"label":"3","text":"S"},{"label":"4","text":"All of the above              పైవనీన"}],"answer":4},{"n":460,"body":"A circular flower bed is surrounded by a path 4m wide.\n       The diameter of the flower bed is 66m, then the area of\n       the path is (in sq. m)\n       ఒక్ వృతాతకార్ పూల తోట చ్చట్యట 4 మీ వెడలుప గల బాట ఉింది పూల\n       తోట యొక్క వాయసిం 66 మీ అయిన బాట వైశాలయిం\n       (చ. మీ లలో)","options":[{"label":"1","text":"140𝜋"},{"label":"2","text":"280𝜋"},{"label":"3","text":"480𝜋"},{"label":"4","text":"240𝜋"}],"answer":2},{"n":461,"body":"The area of a circle of radius 21cm is (in sq. cm)\n      21 సిం. మీ వాయస్థర్్ిం గల వృత్త వైశాలయిం (చ. సిం. మీ లలో)","options":[{"label":"1","text":"1836"},{"label":"2","text":"1368"},{"label":"3","text":"1386"},{"label":"4","text":"1863"}],"answer":3},{"n":462,"body":"The area of a semicircle Whose perimeter 36cm is\n       (in sq. cm)\n       36 సిం. మీ చ్చటుటక్కలత్ గాగల అర్్ వృత్త వైశాలయిం\n       (చ. సిం. మీ లలో)","options":[{"label":"1","text":"77"},{"label":"2","text":"144"},{"label":"3","text":"154"},{"label":"4","text":"235"}],"answer":1},{"n":463,"body":"Number of faces of a cuboid\n      దీర్ఘ ఘనము యొక్క ముఖ్ముల సింఖ్య","options":[{"label":"1","text":"4"},{"label":"2","text":"6"},{"label":"3","text":"8"},{"label":"4","text":"5"}],"answer":2},{"n":464,"body":"The total surface area of the cuboid of measurements\n     6𝑐𝑚 × 4𝑐𝑚 × 2𝑐𝑚 is (𝑖𝑛 𝑐𝑚2 )\n     6 సిం.మీ× 4 సిం.మీ× 2 సిం.మీ క్కలత్లు గల దీర్ఘ ఘనిం\n      సింపూర్ణత్ల వైశాలయిం (చ. సిం. మీ లలో)","options":[{"label":"1","text":"88"},{"label":"2","text":"44"},{"label":"3","text":"48"},{"label":"4","text":"40"}],"answer":1},{"n":465,"body":"The lateral surface area of the cuboid of measurements\n      4𝑐𝑚 × 4𝑐𝑚 × 10𝑐𝑚 is (𝑖𝑛 𝑐𝑚2 )\n      4 సిం.మీ× 4 సిం.మీ× 10 సిం.మీ క్కలత్ల గల దీర్ఘ నిం\n      ప్రక్కత్ల వైశాలయిం (చ. సిం. మీ లలో)","options":[{"label":"1","text":"192"},{"label":"2","text":"96"},{"label":"3","text":"120"},{"label":"4","text":"160"}],"answer":4},{"n":466,"body":"The volume of the cuboid of measurements\n      8𝑐𝑚 × 3𝑐𝑚 × 2𝑐𝑚 is (𝑖𝑛 𝑐𝑚3 )\n      8 సిం.మీ× 3 సిం.మీ× 2 సిం.మీ క్కలత్ల క్లిగన దీర్ఘ నిం\n      ఘణపరిమ్యణిం (ఘ. సిం. మీ లలో)","options":[{"label":"1","text":"64"},{"label":"2","text":"36"},{"label":"3","text":"48"},{"label":"4","text":"24"}],"answer":3},{"n":467,"body":"If the volume of a cuboid is 231𝑐𝑚3 and its height is\n      7𝑐𝑚 then the base area of the cuboid is (𝑖𝑛 𝑐𝑚2 )\n      231 ఘ. సిం.మీ ఘణపరిమ్యణిం క్లిగన దీర్ఘ ఘనిం ఎతత 7 సిం. మీ\n      అయిన ఆ దీర్ఘ ఘనిం భూ వైశాలయిం (చ. సిం. మీ లలో)","options":[{"label":"1","text":"33"},{"label":"2","text":"161"},{"label":"3","text":"44"},{"label":"4","text":"236"}],"answer":1},{"n":468,"body":"The total cost of painting to the four walls of a room of\n      dimensions 4𝑚 × 5𝑚 × 4𝑚,if it cost’s ₹50 to each\n      square meter is\n      ప్రతి చద్ర్పు మీటరుకు ₹50 వింతన 4 మీ× 5 మీ× 4 మీ\n      క్కలత్లు గల గది యొక్క న్నలుగు గోడలకు ర్ింగు వేయడానికి అయ్యయ\n      మొత్తిం ఖ్రుు","options":[{"label":"1","text":"₹3000"},{"label":"2","text":"₹3200"},{"label":"3","text":"₹3600"},{"label":"4","text":"₹4200"}],"answer":3},{"n":469,"body":"The volume of a cuboid of 24𝑐𝑚2 base area and a\n      height of 3cm is (𝑖𝑛 𝑐𝑚3 )\n      24 చ.సిం.మీ భూ వైశాలయిం మరియు 3 సిం. మీ ఎతత క్లిగన దీర్ఘ\n      ఘనిం యొక్క ఘన పరిమ్యణిం (ఘ. సిం. మీ లలో)","options":[{"label":"1","text":"72"},{"label":"2","text":"8"},{"label":"3","text":"27"},{"label":"4","text":"21"}],"answer":1},{"n":470,"body":"Number of edges of a cube is\n      ఒక్ సమఘనిం యొక్క అించ్చల సింఖ్య","options":[{"label":"1","text":"6"},{"label":"2","text":"3"},{"label":"3","text":"10"},{"label":"4","text":"12"}],"answer":4},{"n":471,"body":"The total surface area a cube of side 8cm is (𝑖𝑛 𝑐𝑚2 )\n      8 సిం.మీ భుజము గా గల సమఘనిం సింపూర్ణత్ల వైశాలయిం\n      (చ.సిం.మీ లలో)","options":[{"label":"1","text":"64"},{"label":"2","text":"384"},{"label":"3","text":"256"},{"label":"4","text":"512"}],"answer":2},{"n":472,"body":"The Lateral surface area of a cube of side 10cm is\n      (𝑖𝑛 𝑐𝑚2 )\n      10 సిం.మీ భుజిం పడువు గల సమఘనిం ప్రక్కత్ల వైశాలయిం\n      (చ.సిం.మీ లలో)","options":[{"label":"1","text":"400"},{"label":"2","text":"600"},{"label":"3","text":"1000"},{"label":"4","text":"8000"}],"answer":1},{"n":473,"body":"The volume of a cube of side 6cm is (𝑖𝑛 𝑐𝑚3 )\n      6 సిం.మీ భుజింగా గల సమఘనిం ఘనపరిమ్యణిం\n      (ఘ.సిం.మీ లలో)","options":[{"label":"1","text":"72"},{"label":"2","text":"216"},{"label":"3","text":"144"},{"label":"4","text":"256"}],"answer":2},{"n":474,"body":"The volume of a cube whose base area is 49𝑐𝑚2\n      (𝑖𝑛 𝑐𝑚3 )\n      49 చ. సిం.మీ భూ వైశాలయిం గల సమఘనిం ఘనపరిమ్యణిం\n      (ఘ.సిం.మీ లలో)","options":[{"label":"1","text":"21"},{"label":"2","text":"125"},{"label":"3","text":"243"},{"label":"4","text":"343"}],"answer":4},{"n":475,"body":"The length of the side of a cube whose volume of\n      125𝑐𝑚3 is (𝑖𝑛 𝑐𝑚)\n      125 ఘ. సిం.మీ ఘనపరిమ్యణిం గల సమఘనిం భుజము పడవు\n      (సిం.మీ లలో)","options":[{"label":"1","text":"7"},{"label":"2","text":"5"},{"label":"3","text":"6"},{"label":"4","text":"4"}],"answer":2},{"n":476,"body":"The volume of a cube whose total surface area is\n      600𝑐𝑚2 is (𝑖𝑛 𝑐𝑚3 )\n      600 చ. సిం.మీ సింపూర్ణత్ల వైశాలయిం క్లిగన సమఘనిం\n      ఘనపరిమ్యణిం (ఘ.సిం.మీ లలో)","options":[{"label":"1","text":"1200"},{"label":"2","text":"1800"},{"label":"3","text":"1000"},{"label":"4","text":"2400"}],"answer":3},{"n":477,"body":"The total surface area of a cylinder with radius of base\n      14cm and height of 8cm is (𝑖𝑛 𝑐𝑚2 )\n      8 సిం.మీ ఎతత మరియు 14 సిం. మీ భూ వాయస్థర్్ిం గల స్కాపిం\n      యొక్క సింపూర్ణత్ల వైశాలయిం (చ.సిం.మీలలో)","options":[{"label":"1","text":"1936"},{"label":"2","text":"704"},{"label":"3","text":"616"},{"label":"4","text":"1734"}],"answer":1},{"n":478,"body":"The curved surface area of a cylinder of base radius\n      7cm and height 21cm is (𝑖𝑛 𝑐𝑚2 )\n      7 సిం.మీ భూ వాయస్థర్్ిం మరియు 14 సిం. మీ ఎతత క్లిగన స్కాపము\n      వక్రత్ల వైశాలయిం (చ.సిం.మీలలో)","options":[{"label":"1","text":"462"},{"label":"2","text":"1024"},{"label":"3","text":"684"},{"label":"4","text":"924"}],"answer":4},{"n":479,"body":"The volume of a cylinder with a radius of base 7cm\n      and a height of 10cm is (𝑖𝑛 𝑐𝑚3 )\n      7 సిం.మీ భూ వాయస్థర్్ిం మరియు 10 సిం. మీ ఎతత క్లిగన స్కాపము\n      యొక్క ఘన పరిమ్యణము (ఘ.సిం.మీలలో)","options":[{"label":"1","text":"1540"},{"label":"2","text":"2200"},{"label":"3","text":"3080"},{"label":"4","text":"2463"}],"answer":1},{"n":480,"body":"The volume of a cylinder whose base area is 250𝑚2\n      and a height of 2m is (𝑖𝑛 𝑚3 )\n      250 చ.మీ భూ వైశాలయిం మరియు 2 మీ ఎతత క్లిగన స్కాపము\n      యొక్క ఘనపరిమ్యణము (ఘ.సిం.మీలలో)","options":[{"label":"1","text":"100"},{"label":"2","text":"500"},{"label":"3","text":"750"},{"label":"4","text":"200"}],"answer":2},{"n":481,"body":"A closed cylindrical tank of radius 7m and height 3m\n      is made from a sheet of metal. Then the sheet of metal\n      required is (𝑖𝑛 𝑐𝑚2 )\n      7 మీ వాయస్థర్్ము మరియు 3 మీ ఎతత గల మూయబడీ స్కాపాకార్పు\n      టాయింక్ ఒక్ లోహపు రేకుతో చేయబడినది దీనికి అవసర్మగు\n      లోహపు రేకు పరిమ్యణిం (చ. సిం. మీ లలో)","options":[{"label":"1","text":"220"},{"label":"2","text":"110"},{"label":"3","text":"440"},{"label":"4","text":"460"}],"answer":3},{"n":482,"body":"The height of a cylinder whose base area is 180𝑐𝑚2\n      and volume of 900𝑐𝑚3 is (in cm)\n      భూ వైశాలయిం 180 చ. సిం. మీ మరియు ఘనపరిమ్యణిం\n      900ఘ.సిం.మీ గా గల స్కాపిం ఎతత (సిం. మీ లలో)","options":[{"label":"1","text":"11"},{"label":"2","text":"6"},{"label":"3","text":"5"},{"label":"4","text":"22"}],"answer":3},{"n":483,"body":"A rectangular paper of width 14cm is rolled along its\n      length and a cylinder of radius 20cm is formed, then\n      the volume of the cylinder is (𝑖𝑛 𝑐𝑚3 )\n      వెడలుప 14 సిం. మీ గా గల దీర్ఘ చతర్స్రాకార్ కాగత్ిం ద్వని పడవు\n      వెింబడి చ్చటటబడి 20 సిం. మీ భూ వాయస్థర్్ిం క్లిగన స్కాపిం\n      ఏర్పడిింది ఆ స్కాపిం ఘనపరిమ్యణిం (ఘ. సిం. మీ లలో)","options":[{"label":"1","text":"17600"},{"label":"2","text":"16700"},{"label":"3","text":"15200"},{"label":"4","text":"12500"}],"answer":1},{"n":484,"body":"Slant height of a right circular cone with base radius\n      8cm and height 6cm is (in cm)\n      క్రమ వృతాతకార్ శింఖువు భూ వాయస్థర్్ిం 8 సిం. మీ మరియు ఎతత\n      6 సిం.మీ అయితే ద్వని ఏటవాలు ఎతత (సిం.మీ లలో)","options":[{"label":"1","text":"12"},{"label":"2","text":"15"},{"label":"3","text":"9"},{"label":"4","text":"10"}],"answer":4},{"n":485,"body":"The slant height of the right circular cone is 25cm and\n     its base radius is 15cm, its height is (𝑖𝑛 𝑐𝑚)\n     ఒక్ క్రమ వృత్తకార్ శింఖువు ఏటవాలు ఎతత 25 సిం. మీ మరియు\n      ద్వని భూ వాయస్థర్్ిం 15 సిం. మీ అయిన ఎతత (సిం. మీ లలో)","options":[{"label":"1","text":"15"},{"label":"2","text":"20"},{"label":"3","text":"21"},{"label":"4","text":"22"}],"answer":2},{"n":486,"body":"If the slant height of the right circular cone is 13cm\n      and its base diameter is 24cm then its height is (𝑖𝑛 𝑐𝑚)\n      ఒక్ క్రమ వృతాతకార్ శింఖువు ఏటవాలు ఎతత 13 సిం. మీ మరియు\n      ద్వని భూ వాయసిం 24 సిం. మీ అయిన ద్వని ఎతత (సిం. మీ లలో)","options":[{"label":"1","text":"5"},{"label":"2","text":"6"},{"label":"3","text":"7"},{"label":"4","text":"8"}],"answer":1},{"n":487,"body":"A conical tent is 12m height and a diameter of 10m\n      then its slant height is (𝑖𝑛 𝑚)\n      ఒక్ శింఖువాకార్ గుడార్ిం ఎతత 12 మీ మరియు భూ వాయసము\n      10మీ అయిన ద్వని ఏటవాలు ఎతత (మీ లలో)","options":[{"label":"1","text":"22"},{"label":"2","text":"20"},{"label":"3","text":"13"},{"label":"4","text":"17"}],"answer":3},{"n":488,"body":"The base radius and height of cylinder and cone are\n      equal. If volume of cone is 50𝑐𝑚3 then volume of\n      cylinder is (𝑖𝑛 𝑐𝑚3 )\n      స్కాపిం, శింఖువుల భూ వాయస్థర్్ిం, ఎతతలు సమ్యనిం. శింఖువు\n      ఘనపరిమ్యణిం 50 ఘ.సిం. మీ అయిన స్కాపిం ఘనపరిమ్యణిం\n      (ఘ. సిం. మీ లలో)","options":[{"label":"1","text":"150"},{"label":"2","text":"180"},{"label":"3","text":"300"},{"label":"4","text":"450"}],"answer":1},{"n":489,"body":"A cone and a cylinder has same radius and height then\n      the ratio’s of their volumes is\n      ఒక్ శింఖువు మరియు స్కాపిం ఒకే భూ వాయస్థర్్ము మరియు ఎతతను\n      క్లిగ ఉన్ననయి అయిన వాటి ఘనపరిమ్యణల నిషపతిత","options":[{"label":"1","text":"3:1"},{"label":"2","text":"1:3"},{"label":"3","text":"4:3"},{"label":"4","text":"3:4"}],"answer":2},{"n":490,"body":"A prism has 6 vertices and 12 edges then the number\n      of faces it has\n      ఒక్ పటటకానికి 6 శీరాిలు మరియు 12 అించ్చలు వునన ద్వని ముఖాల\n      సింఖ్య","options":[{"label":"1","text":"10"},{"label":"2","text":"12"},{"label":"3","text":"18"},{"label":"4","text":"8"}],"answer":4},{"n":491,"body":"A pyramid having 20 faces and 12 vertices then\n      number of edges it has\n      ఒక్ పిర్మిడ్ 20 ముఖాలు మరియు 12 శీరాిలు క్లిగవునన ద్వని\n      అించ్చల సింఖ్య","options":[{"label":"1","text":"30"},{"label":"2","text":"26"},{"label":"3","text":"128"},{"label":"4","text":"32"}],"answer":1},{"n":492,"body":"The number of vertices of prism with square base\n      చతర్స్రాకార్ భూమిని క్లిగన పటటక్ము యొక్క శీరాిల సింఖ్య","options":[{"label":"1","text":"12"},{"label":"2","text":"8"},{"label":"3","text":"6"},{"label":"4","text":"10"}],"answer":2},{"n":493,"body":"Surface area of the sphere with radius 𝑟 units is\n      (𝑖𝑛 𝑠𝑞. 𝑢𝑛𝑖𝑡𝑠)\n      𝑟 వాయస్థర్్ిం గల గోళిం ఉపరిత్ల వైశాలయిం (చ. యూనిటీలో)","options":[{"label":"1","text":"4𝜋𝑟 2\n             4"},{"label":"2","text":"𝜋𝑟 2\n             3"},{"label":"3","text":"4𝜋𝑟\n             2"},{"label":"4","text":"𝜋𝑟 3\n             3"}],"answer":1},{"n":494,"body":"The base area of a prism is 250𝑐𝑚2 and its height is\n      8𝑐𝑚 then the volume of the prism is (𝑖𝑛 𝑐𝑚3 )\n      250 చ. సిం.మీ భూ వైశాలయిం క్లిగన పటటక్ము ఎతత 8 సిం. మీ\n      అయిన ద్వని ఘనపరిమ్యణము (ఘ.సిం.మీ లలో)","options":[{"label":"1","text":"2500"},{"label":"2","text":"4000"},{"label":"3","text":"2000"},{"label":"4","text":"3500"}],"answer":3},{"n":495,"body":"The perimeter of the base of a prism is 150cm and its\n       height is 10cm then its lateral surface area is (𝑖𝑛 𝑐𝑚2 )\n       ఒక్ పటటక్ము యొక్క భూమి చ్చటుటక్కలత్ 150 సిం. మీ మరియు\n       ద్వని ఎతత 10 సిం. మీ అయిన ఆ పటటక్ ప్రక్కత్ల వైశాలయిం\n       (చ.సిం.మీ లలో)","options":[{"label":"1","text":"15"},{"label":"2","text":"160"},{"label":"3","text":"1500"},{"label":"4","text":"1200"}],"answer":3},{"n":496,"body":"No. of edges of a triangular pyramid\n      త్రిభుజాకార్ పిర్మిడ్ యొక్క అించ్చల సింఖ్య","options":[{"label":"1","text":"12"},{"label":"2","text":"9"},{"label":"3","text":"3"},{"label":"4","text":"6"}],"answer":4},{"n":497,"body":"The lateral surfaces of right pentagonal pyramid are\n      ఒక్ క్రమ పించ భుజాకార్ పిర్మిడ్ యొక్క ప్రక్కత్లాలు","options":[{"label":"1","text":"Pentagons             పించభుజాలు"},{"label":"2","text":"Triangles             త్రిభుజాలు"},{"label":"3","text":"Rectangles            దీర్ఘ చతర్స్రాలు"},{"label":"4","text":"Squares థరా్ల నిషపతిత 3:4 అయిన వాటి\n      ఘనపరిమ్యణల నిషపతిత","options":[{"label":"1","text":"4:3"},{"label":"2","text":"9:16"},{"label":"3","text":"27:64"},{"label":"4","text":"√3: √4"}],"answer":3},{"n":504,"body":"If volume of a sphere is 480𝑐𝑚3 then volume of\n      hemisphere with Same diameter is (𝑖𝑛 𝑐𝑚3 )\n      ఒక్ గోళిం ఘనపరిమ్యణిం 480 ఘ. సిం. మీ అయితే అదే వాయసిం\n      క్లిగన అర్్ గోళిం ఘనపరిమ్యణిం (ఘ. సిం. మీ లలో)","options":[{"label":"1","text":"120"},{"label":"2","text":"240"},{"label":"3","text":"160"},{"label":"4","text":"400"}],"answer":2},{"n":505,"body":"The word ‘MATHEMATICS’ evolved from the\n      ancient Greek word________\n      ‘MATHEMATICS’ అనే పద్ిం ప్రాచీన గ్రీకు పద్ిం అయిన\n      ________ పద్ిం నుిండి ఉత్పననమైనది","options":[{"label":"1","text":"Mathematica"},{"label":"2","text":"Maths"},{"label":"3","text":"Manthano"},{"label":"4","text":"Measurement"}],"answer":3},{"n":506,"body":"Which is the Sanskrit word for “Mathematics”?\n     “Mathematics” కు సమ్యనమైన సింసృత్ పద్ిం ఏది?","options":[{"label":"1","text":"Ganita              గణత్"},{"label":"2","text":"Counting            లెకికించ్చట"},{"label":"3","text":"Maths               మ్యథ్సు"},{"label":"4","text":"Logic               త్ర్కిం"}],"answer":1},{"n":507,"body":"Who defined Mathematics as “Mathematics is the\n      science of quantity”?\n      “గణత్మింటే పరిమ్యణ శాసరిం” అని గణతానిన నిర్ాచిించినది\n       ఎవరు?","options":[{"label":"1","text":"Aristotle                  అరిస్థటిల్"},{"label":"2","text":"August Comte               ఆగస్ట క్కమేట"},{"label":"3","text":"Henry payengae             హెన్రీ పాయిన్ కేర్"},{"label":"4","text":"Lock                       లాక్"}],"answer":1},{"n":508,"body":"Who defined mathematics as “Mathematics is the\n     science of in direct measurement”?\n     గణతానిన “గణత్మింటే పరోక్ష మ్యపన శాసరిం అని నిర్ాచిించిన\n       వారు ఎవరు?","options":[{"label":"1","text":"Aristotle                  అరిస్థటిల్"},{"label":"2","text":"August Comte               ఆగస్ట క్కమేట"},{"label":"3","text":"Henry payengae             హెన్రీ పాయిన్ కేర్"},{"label":"4","text":"Lock                       లాక్"}],"answer":2},{"n":509,"body":"Who defined Mathematics as “Mathematics is the\n     science that draws conclusions”?\n     “గణత్మింటే అవసర్మైన నిరా్ర్ణలను రాబటేట శాసరిం” అని\n       గణతానిన నిర్ాచిించిన వారు ఎవరు?","options":[{"label":"1","text":"Aristotle                  అరిస్థటిల్"},{"label":"2","text":"August Comte               ఆగస్ట క్కమేట"},{"label":"3","text":"Benjamin pierces           బింజిమన్ పియర్ు"},{"label":"4","text":"Lock                       లాక్"}],"answer":3},{"n":510,"body":"Who said “Mathematics is an art to show different\n      things by one name”?\n      ‘గణత్మింటే వివిధ్ వసుతవులను ఒకే పేరుతో స్కచిించే క్ళ” అని\n       అననది ఎవరు?","options":[{"label":"1","text":"Aristotle                  అరిస్థటిల్"},{"label":"2","text":"Benjamin pierces           బింజిమన్ పియర్ు"},{"label":"3","text":"Henry payengae             హెన్రీ పాయిన్ కేర్"},{"label":"4","text":"Lock                       లాక్"}],"answer":3},{"n":511,"body":"Who defined mathematics as “Mathematics is the way\n     in which man’s mind stabilises in rationalism”?\n     “హేతవాద్ింలో మ్యనవుని మేధ్సుు సిార్పడే మ్యర్గమే గణత్ిం” అని\n      గణతానిన నిర్ాచిించినది ఎవరు?","options":[{"label":"1","text":"Aristotle                     అరిస్థటిల్"},{"label":"2","text":"August Comte                  ఆగస్ట క్కమేట"},{"label":"3","text":"Benjamin pierces              బింజిమన్ పియర్ు"},{"label":"4","text":"Lock                          లాక్"}],"answer":4},{"n":512,"body":"Which of the following is not the nature of\n      Mathematics?\n      క్రింది వానిలో గణత్ిం సాభావిం కానిది ఏది?","options":[{"label":"1","text":"Abstractness                  అమూర్త లక్షణిం"},{"label":"2","text":"Chance to check               సరిచూసుక్కనే విధానిం"},{"label":"3","text":"Logical thinking              తారికక్ ఆలోచన"},{"label":"4","text":"Inaccuracy                    ఖ్చిుత్త్ాిం లేనిది"}]
