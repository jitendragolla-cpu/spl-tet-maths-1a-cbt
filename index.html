tten by\n     బీజగణత్ అనే గింధానిన వ్రాసిన వారవరు","options":[{"label":"1","text":"Aryabhata                ఆర్యభటట"},{"label":"2","text":"Bhaskaracharya           భాసకరాచారుయలు"},{"label":"3","text":"Brahmagupta              బ్రహమ గుపత"},{"label":"4","text":"Mahaveeracharya          మహావీరాచార్య"}],"answer":2},{"n":519,"body":"Who is the father of the geometry?\n     ఫాద్ర్ ఆఫ్ జామెట్రీ అని ఎవర్ని అింటారు?","options":[{"label":"1","text":"Archimedies                  ఆరికమెడీస్"},{"label":"2","text":"Aristotle                    అరిస్థటిల్"},{"label":"3","text":"Euclid                       యూకిీడ్"},{"label":"4","text":"Pythagoras                   పైథాగర్స్"}],"answer":3},{"n":520,"body":"Indian mathematician who gave kuttaka method for\n     solving indifinate equation is\n     అనిశిుత్ సమీక్ర్ణలను “కుటటక్ పద్దతి” ద్వారా స్థధిించిన\n      భార్తీయ గణత్ శాసరవేత్త","options":[{"label":"1","text":"Aryabhata                           ఆర్యభటట"},{"label":"2","text":"Bhaskaracharya                      భాసకరాచార్య"},{"label":"3","text":"Brahma gupta                        బ్రహమ గుపత"},{"label":"4","text":"Sridharacharya                      శ్రీధ్రాచార్య"}],"answer":1},{"n":521,"body":"Who stated unknown/invisible variables as\n     “yavat-tavat”?\n     అజాాత్ / అవయక్త రాశులను “యావత్-తావత్” వింటి పద్వలతో\n      పేర్కకననది ఎవరు?","options":[{"label":"1","text":"Aryabhata                           ఆర్యభటట"},{"label":"2","text":"Bhaskaracharya                      భాసకరాచార్య"},{"label":"3","text":"Brahmagupta                         బ్రహమ గుపత"},{"label":"4","text":"Sridharacharya                      శ్రీధ్ర్చార్య"}],"answer":3},{"n":522,"body":"Who is the author of the book “Elements”\n      “ఎలిమెింట్ు” అనే గ్రింధ్మును వ్రాసినదెవరు","options":[{"label":"1","text":"Pythagoras           పైథాగర్స్"},{"label":"2","text":"Euclid               యూకిీడ్"},{"label":"3","text":"Fermat               ఫెరామట్"},{"label":"4","text":"Plato                పాీటో"}],"answer":2},{"n":523 orrects errors\n            దోష్టలను గురితించి సరిచూచ్చట"}],"answer":3},{"n":540,"body":"By using protractor a student draws an angle 90o , then\n      the achieved objective is.\n      విద్వయరి్ కోణమ్యనిని ఉపోయోగించి 90 o కోణిం గీయట ద్వారా\n      స్థధిించిన లక్షయిం .","options":[{"label":"1","text":"Application       వినియోగిం"},{"label":"2","text":"Knowledge         జాానిం"},{"label":"3","text":"Skill             నైపుణయిం"},{"label":"4","text":"Understanding     అవగాహన"}],"answer":3},{"n":541,"body":"If monthly salary of a person is ₹40,000. Then how\n      much amount he earn for one year? By solving this\n      problem the achieved this objective is\n      ఒక్ వయకిత నెలజీత్ిం ₹40,000 ఐన సింవత్ురానికి అత్ను\n      సింపాదిించే మొత్తిం ఎింత్? ఈ సమసయను స్థధిించడిం ద్వారా పిందే\n      లక్షయిం .","options":[{"label":"1","text":"Application       వినియోగిం"},{"label":"2","text":"Understanding     అవగాహన"},{"label":"3","text":"Knowledge         జాానిం"},{"label":"4","text":"Skill             నైపుణయిం"}],"answer":1},{"n":542,"body":"Arrange the numbers 8324,5678,7924,4932 in\n      ascending order. By solving this achieved objective is.\n      8324,5678,7924,4932 అనే సింఖ్యలను ఆరోహణ క్రమింలో\n      అమర్ుిండి. ఈ సమసయను స్థధిించడిం ద్వారా పిందే లక్షయిం.","options":[{"label":"1","text":"Knowledge         జాానిం"},{"label":"2","text":"Application       వినియోగిం"},{"label":"3","text":"Understanding     అవగాహన"},{"label":"4","text":"Skill             నైపుణయిం"}],"answer":3},{"n":543,"body":"A student represent 3.8, 4.8, 5.8 on number line.\n      Here the achieved objective is.\n      ఒక్ విద్వయరి్ సింఖాయ రేఖ్ పై 3.8,4.8,5.8 అను సింఖ్యలను\n      గురితించాడు .ఇక్కడ స్థధిo పబడిన లక్షయిం .","options":[{"label":"1","text":"Knowledge         జాానిం"},{"label":"2","text":"Understanding     అవగాహన"},{"label":"3","text":"Application       వినియోగిం"},{"label":"4","text":"Skill             నైపుణయిం\n\n                                1     2"}],"answer":4},{"n":544,"body":"One student expressed as , 50%, 1:2 and 0.5. The\n                                2     4\n      achieved objective is\n                 1    2\n      ఒక్ విద్వయరి్ ను , 50%, 1:2 మరియు 0.5 గా వయక్త పరిచాడు. ఈ\n                 2    4\n      చర్య ద్వారా స్థధిింపబడిన లక్షయము","options":[{"label":"1","text":"Skill                  నైపుణయము"},{"label":"2","text":"Knowledge              జాానము"},{"label":"3","text":"Understanding          అవగాహన"},{"label":"4","text":"Application            వినియోగము"}],"answer":3},{"n":545,"body":"The length, breadth and height of a rectangular room\n      are 10 units, 8 units and 6 units respectively. Find area\n      of the base of the room? To solve this problem, the\n      data is\n      ఒక్ దీర్ఘ చతర్స్రాకార్పు గది పడవు, వెడలుప, ఎతతలు వర్సగా\n      10యూనిటుీ, 8 యూనిటుీ మరియు 6 యూనిటుీ అయిన ఆ గది\n      భూ వైశాలయిం ఎింత్? అను సమసయను స్థధిించ్చటకు ద్తాతింశిం","options":[{"label":"1","text":"Sufficient             సరిపోవును"},{"label":"2","text":"In sufficient          సరిపోదు"},{"label":"3","text":"Superfluous            ఎకుకవగును"},{"label":"4","text":"Can’t say              చ్చపపలేము"}],"answer":3},{"n":546,"body":"“The progress and the improvement of mathematics\n     are linked to the prosperity of the state” whose words\n     are these?\n     “గణత్శాసర పురోగతి, అభివృది్, ఆ దేశ శ్రేయసుుతో ముడిపడి\n      ఉింటాయి” అని చ్చపిపనదెవరు?","options":[{"label":"1","text":"Plato                        పేీటో"},{"label":"2","text":"Aristotle                    అరిస్థటిల్"},{"label":"3","text":"Bertand Russell              బట్రిండ్ ర్సుల్"},{"label":"4","text":"Napolean                     నెపోలియన్"}],"answer":4},{"n":547,"body":"Which of the following method is also called “Method\n      of using principles”\n      ఈ క్రింది వానిలో ఏ పద్దతికి “స్కత్ర ప్రయోగ పద్దతి” అని కూడా\n       అింటారు","options":[{"label":"1","text":"Inductive method                ఆగమన పద్దతి"},{"label":"2","text":"Deductive method                నిగమన పద్దతి"},{"label":"3","text":"Analytic method                 విశ్శీషణ పద్దతి"},{"label":"4","text":"Synthetic method                సింశ్శీషణ పద్దతి"}],"answer":2},{"n":548,"body":"Who said “Human minds” greatest ability is deriving\n     intelligence?\n     “మ్యనవ మేధ్సుు యొక్క అతయననమైన ప్రజాానిష్టపద్నమే విశ్శీషణ\n       అని వాయఖాయనిించినది ఎవరు?","options":[{"label":"1","text":"Pestalozzi              పెస్థటలజీ"},{"label":"2","text":"Cominius                క్కమినీయస్"},{"label":"3","text":"Thorndike               థార్న డైక్"},{"label":"4","text":"Aristotle               అరిస్థటిల్"}],"answer":3},{"n":549,"body":"In which method a student can generalise “The product\n      of two odd numbers is an odd number”\n      ఈ క్రింది వానిలో ఏ పద్దతి ప్రకార్ిం ఒక్ విద్వయరిా “రిండు బేసి సింఖ్యల\n       లబదిం బేసి సింఖ్య అవుతింద్ని స్థధార్ణీక్రిించ గలరు","options":[{"label":"1","text":"Synthetic method                సింశ్శీషణ పద్దతి"},{"label":"2","text":"Analytic method                 విశ్శీషణ పద్దతి"},{"label":"3","text":"Inductive method                ఆగమన పద్దతి"},{"label":"4","text":"Deductive method                నిగమన పద్దతి"}],"answer":3},{"n":550,"body":"In which of the following method the teaching process\n     proceeds from what is to be found to what is given in\n     the problem\n     ఈ క్రింది వానిలో ఏ పద్దతి యిందు బోధ్న్న విధానిం స్థరాింశిం\n       నుిండి ద్తాతింశ దిశకు క్కనస్థగుతింది","options":[{"label":"1","text":"Analytic method                 విశ్శీషణ పద్దతి"},{"label":"2","text":"Synthetic method                సింశ్శీషణ పద్దతి"},{"label":"3","text":"Heuristic method                అనేాషణ పద్దతి"},{"label":"4","text":"Project method                  ప్రక్లపన్న పద్దతి"}],"answer":1},{"n":551,"body":"The tool which helps us to achieve the objectives of\n     teaching learning is teaching method. Who said this?\n     బోధ్న, అభయసన్నల లక్షాయలను స్థధిించటానికి ఉపయోగ పడే\n      స్థధ్నమే బోధ్న్న పద్దతి అని తెలిపినది ఎవరు?","options":[{"label":"1","text":"Wesly and young ్ీ్"}],"answer":2},{"n":556,"body":"“Project is a part of life imported into a school”. Who\n     said this?\n     “పాఠశాల లోకి దిగుమతి చేసిన నిజజీవిత్ భాగమే ప్రక్లపన” అని\n       అననది ఎవరు ?","options":[{"label":"1","text":"Arm strong            ఆర్మ స్థరింగ్స"},{"label":"2","text":"Stevenson             స్లటవెన్ సన్"},{"label":"3","text":"Kilpatrick            కిల్ పాట్రిక్"},{"label":"4","text":"Bellards              బలాీర్ీ్"}],"answer":4},{"n":557,"body":"In which method pupils can develop their observation\n     skill and hand skill\n     ఈ క్రింది వాటిలో ఏ పద్దతి యిందు పిలీలలో పరిశీలన, హసతలాఘవ\n       నైపుణయలు పెరుగుతాయి","options":[{"label":"1","text":"Heuristic method                            అనేాషణ పద్దతి"},{"label":"2","text":"Project method                              ప్రక్లపన్న పద్దతి"},{"label":"3","text":"Laboratory method                           ప్రయోగశాల పద్దతి"},{"label":"4","text":"Problem solving method                      సమసయ స్థధ్న పద్దతి"}],"answer":3},{"n":558,"body":"Inductive method was first introduced by\n     ఆగమన పద్దతిని మొద్టి స్థరిగా ప్రవేశ పెటిటనది","options":[{"label":"1","text":"Leibnitz                         లైబినజ్"},{"label":"2","text":"Pestalozzi                       పెస్థటలజీ"},{"label":"3","text":"John Dewey                       జాన్ డూయయి"},{"label":"4","text":"Francis Bacon                    ఫ్రానిుస్ బేక్న్"}],"answer":4},{"n":559,"body":"Which of the following method is natural method to\n       learn mathematics\n       ఈ క్రింది వానిలో గణత్ిం నేరుుకోవడానికి సహజమైన పద్దతి","options":[{"label":"1","text":"Inductive method              ఆగమన పద్దతి"},{"label":"2","text":"Deductive method              నిగమన పద్దతి"},{"label":"3","text":"Analytic method               విశ్శీషణ పద్దతి"},{"label":"4","text":"Synthetic method              సింశ్శీషణ పద్దతి"}],"answer":1},{"n":560,"body":"The person who co-ordinates Inductive and Deductive\n     methods\n     ఆగమన మరియు నిగమన పద్దతలను సమనాయిం చేసిన వారు","options":[{"label":"1","text":"Euclid                        యూకిీడ్"},{"label":"2","text":"William James                 విలియిం జేమ్సు"},{"label":"3","text":"Charles Darvin                చారీస్ డారిాన్"},{"label":"4","text":"Francis Bacon                 ఫ్రానిుస్ బేక్న్"}],"answer":3},{"n":561,"body":"In which of the following methods prepared pupils to\n     get ready to face problems in their daily life.\n     ఈ క్రింది వానిలో ఏ పద్దతి విద్వయరు్ల నిత్య జీవిత్ సమసయలకు\n       సమ్యయత్త పరుసుతింది","options":[{"label":"1","text":"Problem solving method                 సమసయ స్థధ్న పద్దతి"},{"label":"2","text":"Heuristic method                       అనేాషణ పద్దతి"},{"label":"3","text":"Project method                         ప్రక్లపన్న పద్దతి"},{"label":"4","text":"Laboratory method                      ప్రయోగశాల పద్దతి"}],"answer":1},{"n":562,"body":"Which of the following methods develops analytical\n     ability, imagination, creativity among the pupils\n     ఈ క్రింది వానిలో ఏ పద్దతి విద్వయరు్లలో విశ్శీషణ శకిత, ఊహాశకిత,\n       సృజన్నత్మక్త్ను పెింపిందిసుతింది.","options":[{"label":"1","text":"Heuristic method                       అనేాషణ పద్దతి"},{"label":"2","text":"Project method                         ప్రక్లపన్న పద్దతి"},{"label":"3","text":"Problem solving method               సమస్థయ స్థధ్న పద్దతి"},{"label":"4","text":"Laboratory method                      ప్రయోగశాల పద్దతి"}],"answer":3},{"n":563,"body":"Who remarked “ The Synthetic method searches for a\n     needle in a haystake” ?\n     సింశ్శీషణ పద్దతి “ గడిీవాములో స్కది క్కర్కు అనేాష్సుతింది” అని\n       వాయఖాయనిించినది ఎవరు?","options":[{"label":"1","text":"Francis Bacon               ఫ్రానిుస్ బేక్న్"},{"label":"2","text":"Young                       యింగ్స"},{"label":"3","text":"Kilpatric                   కిల్ పాట్రిక్"},{"label":"4","text":"Cominius                    క్కమినీయస్"}],"answer":2},{"n":564,"body":"In which method the teacher acts like a guide and\n       asking thought-provoking questions\n d centric\n             విషయిం శిశుకేింద్రింగా ఉిండాలి"},{"label":"2","text":"Subject should be based on psychology\n             విషయిం మనోవిజాాన శాసరిం ఆధార్ింగా వుిండాలి"},{"label":"3","text":"Concepts must be in the order of learning\n             విషయాలు అభయసన్న క్రమింలో ఉిండాలి"},{"label":"4","text":"No need information about mathematicians and\n             historical points\n             గణత్ శాసరజుాల గురిించి, చారిత్రక్ అింశాల సమ్యచార్ిం\n             అవసర్ిం లేదు"}],"answer":4},{"n":604,"body":"The word ‘curriculum’ is derived from this language is\n      ‘curriculum’ అనే పద్ిం ఈ భాష్ట పద్ిం నుిండి వచిుింది","options":[{"label":"1","text":"Greek          గ్రీకు"},{"label":"2","text":"Latin          లాటిన్"},{"label":"3","text":"French         ఫ్రించ్"},{"label":"4","text":"Arabic         అర్బిక్"}],"answer":2},{"n":605,"body":"Which of the following is not academic standard?\n      క్రింది వాటిలో విద్వయప్రమ్యణము కానిది?","options":[{"label":"1","text":"Problem solving                సమస్థయ స్థధ్న"},{"label":"2","text":"Communication                  భావవయకీతక్ర్ణ"},{"label":"3","text":"Connections                    అనుసింధానిం"},{"label":"4","text":"Creation                       సృష్టించ్చట"}],"answer":4},{"n":606,"body":"A student expressed the equation 𝑥 + 5 = 8 as “If a\n      number is increased by 5 then the result is 8”. Here\n      achieved academic standard is\n      ఒక్ విద్వయరి్ 𝑥 + 5 = 8 అనే సమీక్ర్ణనిన ఈ విధ్ింగా\n      వయక్తపరిచాడు ఒక్ సింఖ్యను 5 పెించగా ఫలిత్ిం 8 వచ్చును. అయితే\n      ఇక్కడ స్థధిింపబడిన విద్వయ ప్రమ్యణిం","options":[{"label":"1","text":"Communication                  భావ వయకిత క్ర్ణ"},{"label":"2","text":"Connection                     అనుసింధానిం"},{"label":"3","text":"Reasoning-proof\n             కార్ణలు చ్చపపడిం-నిరూపణలు చేయడిం"},{"label":"4","text":"Problem-solving                సమస్థయ స్థధ్న"}],"answer":1},{"n":607,"body":"Identify the pair of lesson plan models having\n     exploration and preparation as 1st step respectively\n     శ్యధ్న, సన్ననహిం మొద్టి సోపానింగా గల పాఠయ పథకాల\n      నమూన్నల జత్ను వరుస క్రమింలో గురితించ్చము","options":[{"label":"3","text":"Morrison, Herbartian                  మోరిసన్, హెరాబరుట"},{"label":"2","text":"Herbartian, Morrison                  హెరాబరుట, మోరిసన్"},{"label":"3","text":"Morrison, Evaluation based\n             మోరిసన్, మూలాయింక్ధార్ నమూమ్య"},{"label":"4","text":"Herbartian, R.C.E.M model\n             హెరాబరుట, ఆర్.సి.ఇ.యిం నమూన్న"}],"answer":1},{"n":608,"body":"Identify the pair of lesson plan models having\n      “recapitulation and recitation” as last step respectively\n      పునరిామర్ే , వలెీవేయడిం చివరి సోపాన్నలుగా గల పాఠయ పథకాల\n       నమూన్నల జత్ను వరుస క్రమింలో గురితించ్చము","options":[{"label":"1","text":"Morrison, Herbartian                మోరిసన్, హెరాబరుట"},{"label":"2","text":"Herbartian, Morrison                హెరాబరుట, మోరిసన్"},{"label":"3","text":"Morrison, Evaluation based\n              మోరిసన్, మూలాయింక్ధార్ నమూన్న"},{"label":"4","text":"Herbartian, R.C.E.M model\n              హెరాబరుట, ఆర్.సి.ఇ.యిం నమూన్న"}],"answer":2},{"n":609,"body":"The lesson plan based on system approach is\n     వయవస్థా ఉపగమిం పై ఆధార్పడిన పాఠయ పథక్ నమూన్న","options":[{"label":"1","text":"Herbartian approach         హెరాబరుట నమూన్న"},{"label":"2","text":"Morrison approach           మోరిసన్ నమూన్న"},{"label":"3","text":"Evaluation based approach\n              మూలాయింక్న్నధార్ నమూన్న"},{"label":"4","text":"R.C.E.M approach\n              ఆర్.సి.ఇ.యిం నమూన్న"}],"answer":4},{"n":610,"body":"One of the limitations of objective type test is\n      క్రింది వానిలో ఒక్టి విషయనిషట రూప పర్డక్షల పరిమితి","options":[{"label":"1","text":"Diagnostic value లోప నిరా్ర్ణ విలువ"},{"label":"2","text":"Touches more topics\n              ఎకుకవ విషయాలను సపృశిసుతింది"},{"label":"3","text":"Reliable in scores గణనలోీ విశాసనీయత్"},{"label":"4","text":"Decline in language ability\n              భాష్ట స్థమర్్యిం క్షీణసుతింది"}],"answer":4},{"n":611,"body":"Oral examination should find a place in Evaluation.\n      This suggestion is given by\n      మూలాయింక్నిం లో మౌఖిక్ పర్డక్షలకు కూడా స్థానిం ఉిండాలి అని\n       స్కచిించినది","options":[{"label":"1","text":"APSCF 2011"},{"label":"2","text":"NCF 2005"},{"label":"3","text":"SGF 2006"},{"label":"4","text":"Kothari Commission          క్కఠ్ర్డ క్మీషన్"}],"answer":1},{"n":612,"body":"This Assessment method gives feedback\n      కిిందివానిలో పరిపుష్టని ఇచేు మదిింపు పద్్తి","options":[{"label":"1","text":"Diagnostic Assessment\n             లోపనిరా్ర్ణ మదిింపు"},{"label":"2","text":"Formative Assessment\n             నిరామణత్మక్ మదిింపు"},{"label":"3","text":"Summative Assessment\n             సింగ్రహణత్మక్ మదిింపు"},{"label":"4","text":"Pragnostic Assessment\n             ప్రాగుపితక్ మదిింపు"}],"answer":2},{"n":613,"body":"Which of the following gives a priority to knowledge\n      construction\n      కిింది వానిలో జాాన నిరామణనికి ప్రాధానయత్నిచేు అింశిం","options":[{"label":"1","text":"Assessment             మదిింపు"},{"label":"2","text":"Test                   పర్డక్ష"},{"label":"3","text":"Evaluation             మూలాయింక్నిం"},{"label":"4","text":"Measurement            మ్యపనిం"}],"answer":4},{"n":614,"body":"When a test is administered on students multiple times,\n      the students scored same marks. What is this\n      characteristic is called\n      ఒకే నిక్ష ను అనేక్ పరాయయములు విద్వయరు్లకు నిర్ాహిించడిం\n      వలన ఒకే ఫలితాలను ఇస్తత ఆ నిక్షకు ఉనన లక్షణమును ఏమింటారు","options":[{"label":"1","text":"Reliability            విశాసనీయత్"},{"label":"2","text":"Validity               సప్రమ్యణత్"},{"label":"3","text":"Objectivity            లక్షాయత్మక్త్"},{"label":"4","text":"Practicability         ఆచర్ణీయత్"}],"answer":1},{"n":615,"body":"“Interest is the true indicator of success”stated by\n      “అభిరుచి అనేది విజయానికి ముగింపు స్కచిక్” అని పేర్కకననది","options":[{"label":"1","text":"Strong                స్థరింగ్స"},{"label":"2","text":"Johns                 జాన్ు"},{"label":"3","text":"Crow & Crow           క్రో మరియు క్రో"},{"label":"4","text":"Murphy                ముర్డు"}],"answer":1},{"n":616,"body":"After completion of specific teaching learning process\n      this type of Evaluation to be conducted\n      నిరి్షట బోధ్న్నభయసన ప్రక్రయ ముగసిన త్రువాత్ నిర్ాహిించే\n      మూలాయింక్నిం","options":[{"label":"1","text":"Summative Assessment\n             సింగ్రహణత్మక్ మదిింపు"},{"label":"2","text":"Prognostic Assessment\n             ప్రాగుపితక్ మదిింపు"},{"label":"3","text":"Diagnostic Assessment\n             లోపనిరా్ర్ణ మదిింపు"},{"label":"4","text":"Formative Assessment\n             నిరామణత్మక్ మదిింపు"}],"answer":1},{"n":617,"body":"The most useful Evaluation tool for Formative\n      Assessment is\n      ఈ నిరామణత్మక్ మూలాయింక్నమునకు ఎకుకవ ఉపయోగపడు\n      మూలాయింక్న్న స్థధ్నిం","options":[{"label":"1","text":"Oral tests                        మౌఖిక్ పర్డక్షలు"},{"label":"2","text":"Rating Scales                     నిరా్ర్ణ పర్డక్షలు"},{"label":"3","text":"Practical Examinations            ప్రయోగ పర్డక్షలు"},{"label":"4","text":"Written tests                     రాత్ పర్డక్షలు"}],"answer":1},{"n":618,"body":"One of the following is not the characteristic of\n      Evaluation\n      కిింది వాటిలో ఉత్తమ మూలాయింక్న లక్షణిం కానిది","options":[{"label":"1","text":"Comprehensive      సమగ్రింగా ఉిండాలి"},{"label":"2","text":"Subjectivity       ఆతామశ్రయత్ను క్లిగ ఉిండాలి"},{"label":"3","text":"Validity           సప్రమ్యణత్ను క్లిగ ఉిండాలి"},{"label":"4","text":"Reliability        విశాసనీయత్ను క్లిగ ఉిండాలి"}],"answer":2},{"n":619,"body":"Which one of the following does not belong to self –\n      reporting technique\n      క్రింది వానిలో స్లాయ నివేదిక్ పద్దతికి చ్చింద్నది.","options":[{"label":"1","text":"Interview                 పరిపృచి"},{"label":"2","text":"Check -list               చ్చక్ లిస్ట"},{"label":"3","text":"Interview inventory       అభిరుచి శ్యధిక్"},{"label":"4","text":"Questionnaire             ప్రశానవళి"}],"answer":2},{"n" let answers = Array(DATA.length).fill(null);
let review = new Set();
let current = 0;
let submitted = false;

function esc(s){{return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}}
function render(){{
  const root=document.getElementById('questions');
  root.innerHTML=DATA.map((q,i)=>{{
    const opts=q.options.map((o,j)=>`<label class="opt ${{answers[i]===j+1?'selected':''}}" data-q="${{i}}"><input type="radio" name="q${{i}}" value="${{j+1}}" ${{answers[i]===j+1?'checked':''}} onchange="choose(${{i}},${{j+1}})"><span class="olabel">(${{esc(o.label)}})</span><span class="otext">${{esc(o.text)}}</span></label>`).join('');
    return `<section class="card question" id="q-${{i}}"><div class="qhead"><div class="qnum">${{q.n}}</div><div class="qtext">${{esc(q.body)}}</div></div><div class="options">${{opts}}</div></section>`;
  }}).join('');
  updateStats(); renderPalette();
}}
function choose(i,v){{
  const y=window.scrollY; answers[i]=v; updateStats();
  document.querySelectorAll(`.opt[data-q="${{i}}"]`).forEach((el,j)=>el.classList.toggle('selected',j===v-1));
  renderPalette(); window.scrollTo(0,y);
}}
function updateStats(){{
  const a=answers.filter(v=>v!==null).length;
  document.getElementById('answered').textContent=a;
  document.getElementById('remaining').textContent=DATA.length-a;
  document.getElementById('reviewed').textContent=review.size;
}}
function renderPalette(){{
  document.getElementById('palette').innerHTML=DATA.map((q,i)=>`<button class="pbtn ${{answers[i]!==null?'answered':''}} ${{review.has(i)?'review':''}} ${{current===i?'current':''}}" onclick="go(${i})">${{q.n}}</button>`).join('');
}}
function go(i){{current=i;document.getElementById('q-'+i)?.scrollIntoView({{behavior:'smooth',block:'start'}});renderPalette();}}
function nextQ(){{if(current<DATA.length-1)go(current+1)}}
function prevQ(){{if(current>0)go(current-1)}}
function clearAnswer(){{answers[current]=null;render();go(current)}}
function markReview(){{review.has(current)?review.delete(current):review.add(current);updateStats();renderPalette()}}
function submitTest(){{
  const unanswered=answers.filter(v=>v===null).length;
  if(!confirm(`Submit test?\nAnswered: ${{DATA.length-unanswered}} / ${{DATA.length}}\nUnanswered: ${{unanswered}}`)) return;
  submitted=true;
  let correct=0;
  DATA.forEach((q,i)=>{{if(answers[i]===q.answer)correct++}});
  const pct=(correct/DATA.length*100).toFixed(2);
  document.getElementById('scoreText').textContent=`Score: ${{correct}} / ${{DATA.length}} (${{pct}}%)`;
  document.getElementById('resultDetail').textContent=`Correct: ${{correct}} • Wrong: ${{DATA.length-unanswered-correct}} • Unanswered: ${{unanswered}}`;
  document.getElementById('result').classList.add('show');
  DATA.forEach((q,i)=>{{
    document.querySelectorAll(`.opt[data-q="${{i}}"]`).forEach((el,j)=>{{
      el.classList.remove('correct','wrong');
      if(j+1===q.answer) el.classList.add('correct');
      if(answers[i]===j+1 && answers[i]!==q.answer) el.classList.add('wrong');
    }});
  }});
  window.scrollTo({{top:0,behavior:'smooth'}});
}}
function resetTest(){{location.reload()}}

render();
</script>
